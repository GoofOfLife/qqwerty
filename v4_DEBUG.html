redetect.from | Номер оборвавшейся цепочки, продолжением которой выглядит новая (новая — колонка dv события).
redetect.gapSec | Пауза между последней рамкой старой цепочки и первой новой, с.
redetect.ds | Невязка по s между положением новой цепочки и экстраполяцией старой, м.
redetect.hardLinked | 1 — старая цепочка была из двух и более рамок (скорость определена); 0 — из одной рамки (связь слабая).
#funnel
ВАЖНО | В JSON: funnel.v4 — воронка v4 (считает ЦЕПОЧКИ детектора и треки, как в приложении); funnel.v2 — воронка V2 с раздельными сущностями; funnel.loss — причины потерь по переходам. В CSV: таблицы funnel (entity;class;stage;count) и loss_reasons. Цифры разных сущностей НЕ складываются и не равны числу уникальных машин (оно неизвестно).
v4.veh | Число цепочек рамок детектора (в терминах v4 — «машин»): последовательности рамок в одной полосе в зоне замера, связанных по метрической координате и скорости. Зависит от каденса детектора.
v4.trk | Цепочек, к которым привязан хотя бы один трек (блоб трека лежит в рамке цепочки).
v4.conf | Цепочек с подтверждённым треком.
v4.shown | Цепочек, по которым показывалось число.
v4.early | Цепочек, у которых число было показано РАННИМ способом (по воротам).
v4.final | Цепочек с проверенным итогом T1.
v4.prov | Цепочек, у которых есть только предварительный итог T2.
v4.finalAny | Цепочек с любым итогом (T1 или T2).
v4.rejected | Цепочек с треками, но без итога (отказ).
v4.vehNoTrack | Цепочек без треков (детектор машину видел, трекер трек не создал).
v4.open | Цепочек, которые ещё идут или закончились менее 1,2 с назад.
v4.tracks | Всего треков.
v4.ended | Треков закончено.
v4.passes | Треков с итогом (T1 или T2).
v4.passes1 | Из них с итогом T1.
v4.falseTags | Закончившихся треков с нарисованной меткой, без итога и без признаков машины (рамки детектора и класса не было) — «ложные метки».
v4.noFinal | Закончившихся треков с нарисованной меткой, без итога, но с признаками машины (рамка детектора или класс).
v4.lost | Событий «трек потерян» (lost): показанный трек без блоба переведён в список потерянных.
v4.trkLost | То же (дубль поля lost для совместимости с v4).
v4.trkLostFinal | Потерянных треков, не возрождённых за reviveSec (завершены как есть; счётчик limboExp).
v4.revive | Возрождений потерянного трека с тем же ID.
v4.recover | Восстановлений трека после короткого пропуска (recover).
v4.hold | Привязок блоба по перекрытию без точки (hold). В v4 ветка выключена, поэтому обычно 0.
v4.ptBad | Точек, отброшенных онлайн (tr.bad) как не согласующиеся с прогнозом.
v4.xlaneUnion | Случаев, когда блоб соседней полосы принят как объединение с осколками той же машины (исключение из правила XLANE).
v4.detObs | Наблюдений детектора в зоне замера: каждая рамка при каждом вызове детектора. Это НЕ машины и не цепочки.
v4.detObsNoNum | Из них наблюдений без показанного трека под рамкой.
v4.idSw | Смен ID (событие idswitch CORE).
v4.skipped | Кадров, пропущенных трекером из-за состояния стабилизации (init + lost + coast).
v4.sk | Те же пропуски по состояниям: init (поиск), lost (потеряна), coast (держу по прогнозу).
v4.stabEstSkip | Кадров, обработанных трекером, где пропущена только оценка позы стабилизатора (static-режим).
v2.at | Видео-время последнего кадра трекера, с (на этот момент считались сущности).
v2.stages | Порядок стадий в таблицах: total, tracked, confirmed, shown, early, finalT1, provT2, rejected, noTrack, open. Это счётчики признаков, а не последовательные «воронки на сужение»: единица может быть и early, и finalT1.
v2.limitations | Текст ограничений воронки V2 (какие сущности и почему не сопоставимы).
v2.entities.detObs | Наблюдений детектора в зоне замера (см. v4.detObs).
v2.entities.detObsNoNum | Наблюдений детектора без показанного трека (см. v4.detObsNoNum).
v2.entities.chains | Цепочек рамок детектора.
v2.entities.chainsSingleBox | Цепочек из одной рамки (дальше не продолжаются).
v2.entities.chainsRedetLinked | Цепочек, которые выглядят продолжением оборвавшейся (re-detect, пауза 1,2–4 с).
v2.entities.tracks | Треков трекера.
v2.entities.tracksEnded | Треков закончено.
v2.entities.tracksWithChain | Треков, чей блоб хоть раз лежал в рамке детектора (есть цепочка).
v2.entities.tracksNoChain | Треков без цепочки.
v2.entities.tracksVehicleLike | Треков, подтверждённых или получивших класс детектора («машинные»).
v2.entities.vehStrict | Оценка числа машин, строгая связь (компоненты связности граф «цепочки ↔ треки», связь только по попаданию блоба в рамку).
v2.entities.vehLinked | Оценка числа машин, расширенная связь (+ re-detect цепочек и треки-дубли).
v2.entities.vehLinkedMergedStrict | Сколько linked-компонент склеили несколько strict.
v2.entities.finishAttempts | Попыток итоговой оценки (вызовов _finishCore по сегменту точек; у одного трека бывает несколько).
v2.entities.finishAttemptsRecorded | Сколько попыток записано в таблицу attempts (меньше предыдущего, если сработал лимит).
v2.entities.finishOkT1 | Попыток, давших проверенный итог T1.
v2.entities.finishOkT2 | Попыток, давших предварительный итог T2.
v2.entities.finishFail | Попыток без результата (отказ).
v2.entities.earlyAttempts | Вызовов ранней оценки (_early), НЕ давших числа. Вызов, показавший число, сюда не входит (это earlyShown).
v2.entities.earlyShown | Треков, у которых первое число показано по воротам (mode gate).
v2.entities.liveShown | Треков, у которых первое число показано по регрессии (mode wls).
v2.chain | Таблица «класс × стадия» для цепочек детектора (строки all, car, truck, bus, other; колонки — стадии v2.stages).
v2.track | То же для треков (все). Итог T1 = finalT1, T2 = provT2, отказ = rejected, ещё идёт = open.
v2.trackVehLike | То же для «машинных» треков (подтверждены или с классом детектора).
v2.vehStrict | То же для оценки машин strict.
v2.vehLinked | То же для оценки машин linked.
v2.loss | Причины потерь на переходах, по сущностям и классам (то же, что funnel.loss и таблица loss_reasons).
loss.entity | Сущность: chain, track, vehStrict, vehLinked, attempt (попытка итога), earlyAttempt (ранний вызов), earlyFinal (досье «ранняя → итог»).
loss.class | Класс: car, truck, bus, other (всё остальное, включая unknown) или all.
loss.from | Откуда переход (например DETECTED, TRACKED, CONFIRMED, SHOWN, BORN, EARLY_TRY, FINISH_ATTEMPT, EARLY).
loss.to | Куда переход не состоялся (TRACKED, CONFIRMED, SHOWN, FINAL, NOT_SHOWN, RESULT).
loss.reason | Причина (коды — раздел values).
loss.n | Сколько единиц сущности потеряно по этой причине.
#frames
ОБЩЕЕ | Одна строка на каждый кадр, ОБРАБОТАННЫЙ трекером (после init/lost/coast). Кадры, пропущенные браузером, интервалом анализа или стабилизатором, строк не дают — их число в meta.run (cbFrames, skipInterval, skipDup, stabSkip). Таблица (как blobs, trackFrames, detector, rejectedCandidates) в JSON lite опущена.
t | Время кадра, с видео-времени (метка кадра).
stab | Состояние стабилизатора в этом кадре: ok, init (поиск), coast (держу по прогнозу), lost (потеряна), off (без стабилизации).
shiftPx | Сдвиг кадра относительно эталона, px.
sway | Оценка раскачки камеры (sway), px.
nBlobs | Число блобов движения в кадре после фильтров.
nTracks | Число треков трекера (живых) после обработки кадра.
detAgeSec | Возраст последних рамок детектора, с (пусто — детектор не работал).
nDetBoxes | Сколько рамок в последнем вызове детектора.
overload | 1 — кадр в режиме перегрузки (R.hi): детектор и уточнение кромки работают реже.
anIvMs | Текущий интервал анализа, мс.
#blobs
ОБЩЕЕ | Одна строка на каждый блоб движения в каждом кадре трекера (после фильтров размера). Блоб без трека — trackId пусто.
t | Время кадра, с.
i | Номер блоба в кадре.
lane | Полоса блоба (0 — вне полос).
area | Площадь блоба, px².
w | Ширина блоба, px.
h | Высота блоба, px.
fill | Заполненность рамки блоба: area / (w × h), 0…1.
wPctLane | Ширина блоба в процентах от ширины полосы на его высоте (относительный размер машины).
yb | Нижняя кромка блоба (y), px кадра анализа.
ownerFrac | Для владельца кластера: его площадь / максимальная площадь в кластере (1 — единственный, меньше 1 — были более крупные части). Пусто — кластера не было.
fragArea | Площадь отброшенных частей кластера (owner-площадь exA), px².
overlapPct | Какая часть ширины блоба (вместе с осколками) лежит вне его полосы, %.
detCls | Класс рамки детектора, накрывающей блоб (пусто — рамки нет).
detScore | Уверенность (score) этой рамки.
detOverlap | Доля блоба, перекрытая рамкой, 0…1 (признак «det» — от 0,3).
flags | Битовая маска свойств блоба: 1 usable (из блоба можно взять точку), 2 clipped (обрезан границей зоны), 4 touching (касается нижнего края кадра), 8 soft (обрезан, но виден на заметной ширине — точка берётся с большей σ), 16 weak (оставлен как слабый кандидат благодаря рамке детектора), 32 det (рамка детектора перекрывает блоб ≥ 0,3), 64 refined (кромка уточнена), 128 merged (склейка блобов). Значения суммируются.
trackId | Номер трека, которому блоб привязан в этом кадре (пусто — не привязан).
dv | Номер цепочки детектора (только при перекрытии рамкой ≥ 0,3).
#trackFrames
ОБЩЕЕ | Одна строка на каждый трек в каждом кадре трекера, пока трек жив (включая кадры пропуска).
t | Время кадра, с.
id | Номер трека.
lane | Полоса трека.
miss | Сколько кадров подряд у трека нет привязанного блоба (0 — блоб есть).
frames | Сколько кадров прожил трек.
pts | Сколько точек регрессии накоплено.
kmhLive | Текущая показанная скорость (tr.kmh), км/ч; пусто — число не показывается.
kmhA_st | Скорость метода A — взвешенная регрессия с учётом стабилизации (stabK), км/ч.
kmhB_gate | Скорость метода B — по воротам (kmhB), км/ч.
rawK | Сырая скорость окна до сглаживания, км/ч.
fltK | Скорость после фильтра, км/ч.
conf | Уверенность числа (low, mid, high; пусто — числа нет).
shown | 1 — число уже было показано.
relErr | Относительная ошибка наклона регрессии (tr.err).
liveRms | RMS регрессии по окну, м.
fresh | 1 — в этом кадре блоб трека получен (не прогноз).
x | Координата x центра трека, px.
y | Координата y (кромка) трека, px.
#detector
ОБЩЕЕ | Одна строка на каждую рамку детектора машин при каждом вызове детектора (рамки с учётом отступа pad, в координатах калибровки). Вызовы идут с каденсом детектора, а не на каждый кадр.
t | Время кадра, к которому относится вызов детектора, с.
cls | Класс рамки: car, truck, bus, motorcycle и др.
score | Уверенность детектора, 0…1.
x0 | Левый край рамки, px.
y0 | Верхний край рамки, px.
x1 | Правый край рамки, px.
y1 | Нижний край рамки, px.
lane | Полоса, в которую попадает низ рамки по центру (0 — вне полос).
inZone | 1 — рамка в зоне замера: низ ниже y0 + 0,1 × высоты кадра, выше 0,97 × высоты, центр внутри полос (те же условия, что у счётчика «наблюдения без числа»).
dv | Номер цепочки детектора (только для рамок в зоне).
#rejectedCandidates
ОБЩЕЕ | Одна строка на каждого кандидата-блоба, не прошедшего размерные фильтры (мелкий, тонкий или неплотный), и на кандидатов, оставленных только благодаря рамке детектора (WEAK_KEPT).
t | Время кадра, с.
lane | Полоса кандидата.
area | Площадь, px².
w | Ширина, px.
h | Высота, px.
fill | Заполненность area / (w × h).
wPctLane | Ширина в процентах от ширины полосы.
yb | Нижняя кромка, px.
failedFilters | Какие фильтры размера не пройдены (через +): area (минимум площади в px), width, height, area2 (площадь относительно полосы), fill (заполненность).
outcome | Исход: REJECT_SMALL_BLOB — отвергнут как мелкий; REJECT_BAD_FILL — отвергнут по заполненности; WEAK_KEPT — оставлен слабым кандидатом из-за рамки детектора.
detCls | Класс рамки детектора под кандидатом (пусто — рамки нет).
detScore | Score этой рамки.
detOverlap | Перекрытие кандидата рамкой, 0…1.
dv | Номер цепочки детектора (если перекрытие ≥ 0,3).
#setup
ОБЩЕЕ | Настройки и окружение прогона (JSON: meta.setup; CSV: таблица setup «key;value», вложенные поля через точку, массивы через «|»). Нужны, чтобы повторить прогон и понять, сопоставимы ли два прогона: сравнивайте settingsHash, число кадров трекера и вызовов детектора.
schema | Версия схемы выгрузки (v4_DEBUG/1).
build | Строка сборки (v4_DEBUG, база — v4 = index_v3.1.html).
date | Время выгрузки, ISO 8601 в UTC.
tzOffsetMin | Смещение часового пояса устройства, минут к востоку от UTC.
page.search | Параметры адресной строки (например ?dbx=off — расширенная диагностика выключена).
page.title | Заголовок страницы.
env.userAgent | User-Agent браузера.
env.platform | Платформа браузера.
env.language | Язык браузера.
env.hardwareConcurrency | Число логических ядер процессора.
env.deviceMemoryGB | Объём памяти устройства, ГБ (если браузер сообщает).
env.screenPx | Размер экрана, px (ширина x высота).
env.dpr | Плотность пикселей экрана (devicePixelRatio).
env.secureContext | true — страница открыта в защищённом контексте (HTTPS).
video.name | Имя файла видео (пусто при камере).
video.kind | Источник: file — видеофайл, camera — камера.
video.fromStart | true — прогон начат с начала файла (чистый старт ↺).
video.mediaDurationSec | Длительность видео по данным браузера, с.
video.fileDurS | Длительность файла, записанная приложением, с.
video.width | Ширина исходного видео, px.
video.height | Высота исходного видео, px.
video.playbackRateNow | Текущая скорость воспроизведения (в режиме BENCH меняется).
video.currentTimeSec | Позиция воспроизведения на момент выгрузки, с.
video.ended | true — видео доиграно до конца.
video.analysedSec | Сколько секунд видео реально проанализировано трекером (сумма интервалов между обработанными кадрами; разрыв больше 0,5 с считается как 0,5 с).
video.trackerFrames | Сколько кадров обработано трекером.
analysis.aw | Ширина кадра анализа, px.
analysis.ah | Высота кадра анализа, px.
analysis.anIvMsNow | Текущий интервал анализа, мс.
analysis.srcDtSec | Оценка интервала между кадрами источника, с.
analysis.bench | true — режим BENCH (повторяемое воспроизведение для сравнения).
analysis.logicOld | true — включена логика v3 (OLD), false — v3.1 (NEW, устойчивая итоговая оценка).
analysis.robustEnabled | true — устойчивая итоговая оценка CONFIG.track.robust включена.
analysis.detectorLoaded | true — детектор машин загружен.
analysis.detectorState | Состояние детектора (ready, loading, error, …).
analysis.detectorGate | true — детектор участвует в решениях (vdGate).
analysis.refineOffNow | true — уточнение кромки сейчас отключено (по бюджету времени).
analysis.dbxOn | true — расширенная диагностика включена (кнопка DBX).
frameIntervals.n | Сколько интервалов между кадрами трекера посчитано.
frameIntervals.frames | Сколько кадров трекера в журнале.
frameIntervals.tFirst | Время первого кадра, с.
frameIntervals.tLast | Время последнего кадра, с.
frameIntervals.medSec | Медианный интервал между обработанными кадрами, с.
frameIntervals.p90Sec | 90-й процентиль интервала, с.
frameIntervals.p99Sec | 99-й процентиль интервала, с.
frameIntervals.maxSec | Максимальный интервал, с (большой — трекер «слепнул»: стабилизатор, пауза, потеря кадров).
frameIntervals.gt100ms | Сколько интервалов длиннее 0,1 с.
frameIntervals.gt250ms | Сколько интервалов длиннее 0,25 с.
frameIntervals.gt1s | Сколько интервалов длиннее 1 с.
frameIntervals.logTruncated | true — журнал кадров переполнен и интервалы посчитаны не по всем кадрам.
calibration.gates.n | Число ворот.
calibration.gates.v | Строки ворот в метрике кадра (0 — верх, 1 — низ), от нижних к верхним.
calibration.gates.aim | Опорные точки поворота линий ворот.
calibration.gates.rot | Углы наклона линий ворот, рад. (плюс — правая сторона ниже).
calibration.gates.mode | Способ задания расстояний: marks — по меткам на дороге (шаг markM), иначе — вручную.
calibration.gates.markM | Шаг разметки, м.
calibration.gates.steps | Сколько шагов разметки между соседними воротами.
calibration.gates.meters | Расстояния между соседними воротами, м.
calibration.gates.perLane | true — у каждой полосы свои ворота.
calibration.gates.L | Наборы ворот по полосам (при perLane).
calibration.lanes.n | Число полос.
calibration.lanes.b | Границы полос.
calibration.lanes.types | Типы полос.
calibration.limitKmh | Лимит скорости на экране, км/ч (влияет только на подсветку, не на расчёт).
calibration.calibs | Калибровки по полосам: vs — строки ворот; ss — расстояния от первых ворот, м; a, b, c — коэффициенты модели s(v) = (a·v + b) / (c·v + 1); vFar, vNear — дальняя и ближняя границы рабочей зоны (в метрике кадра); sMax — дальность зоны, м; sBottom — расстояние на нижнем краю кадра, м; sLast — расстояние до последних ворот, м; rms, rmsPct — невязка подгонки, м и % пути; exact — 1, если ворот не больше трёх (подгонка точная).
settingsHash | Короткий хеш настроек (CONFIG, калибровка, bench, logicOld, размер кадра, детектор). Два прогона сравнимы, только если хеш совпадает.
coreIntegrity.expectedV4 | Хеш, длина и число строк блока CORE в исходной v4 (подставлены при сборке).
coreIntegrity.actual | Те же величины, посчитанные в запущенной странице по её собственному тексту.
coreIntegrity.identical | true — блок CORE этой страницы побайтно совпадает с v4. false или null — результат нельзя считать результатом v4.
repeat | Как повторить прогон.
#meta
ОБЩЕЕ | Служебная часть JSON (раздел meta). В CSV те же сведения — в таблицах setup, drops, dictionary и в блоке #SUMMARY.
app | Название приложения и сборки.
schema | Версия схемы выгрузки.
build | Строка сборки.
date | Время выгрузки, ISO 8601 в UTC.
lite | true — это JSON lite: покадровые таблицы (frames, blobs, trackFrames, detector, rejectedCandidates) и hrPoints опущены, оставлены только размеры.
video | Имя файла видео.
videoSecAnalysed | Сколько секунд видео проанализировано (см. setup video.analysedSec).
frames | Сколько кадров обработано трекером.
detector | true — детектор машин включён и участвует в решениях.
config | Копия CONFIG на момент выгрузки: все пороги и параметры алгоритма (в CSV — в таблице setup как config.*).
setup | Настройки и окружение прогона (раздел setup).
run | Отпечаток прогона (сопоставимость, частота кадров, нагрузка) — описание полей ниже.
profile | Профиль прогона в формате v4 (profJson): общие счётчики приложения.
xcfg | Пороги диагностики (классификатор причин HIGH_RMS и классов «ранняя → итог», лимиты журнала). На алгоритм не влияют; по ним можно пересчитать разметку офлайн.
hook | Стоимость диагностики: totalMs — всего, мс; perFrameMs — на кадр трекера, мс; byHook — по хукам.
tables | Размер каждой таблицы журнала: rows — записей, cap — лимит, dropped — сколько не поместилось.
drops | Всё, что не поместилось в журнал: счётчики по таблицам и по типам событий.
capHits | Сколько раз срабатывали лимиты журналов (общий счётчик).
errors | Ошибки самой диагностики (хук, сообщение, стек, время); до 30 штук. Непустой список означает, что часть диагностических данных могла не записаться; алгоритм при этом не затронут.
limitations | Список ограничений диагностики (что нельзя получить или что является гипотезой).
columns | Списки колонок таблиц в том порядке, в каком они идут в CSV.
notes | Краткая карта выгрузки.
run.build | Строка сборки.
run.logic | Логика итоговой оценки: NEW(robust) — v3.1, OLD(v3) — v3.
run.bench | true — режим BENCH.
run.benchRate | Минимальная и максимальная скорость воспроизведения в BENCH за прогон.
run.vidSec | Сколько секунд видео проанализировано.
run.wallSec | Реальное время с начала прогона, с.
run.cbFrames | Сколько раз браузер вызвал колбэк кадра видео.
run.srcPresented | Сколько кадров показал источник за прогон (пусто, если браузер счётчик не даёт).
run.droppedByBrowser | Сколько кадров браузер показал, но не передал анализу (srcPresented − cbFrames).
run.skipNotReady | Кадров пропущено: кадр не готов.
run.skipDup | Кадров пропущено: повторная метка времени.
run.skipInterval | Кадров пропущено из-за интервала анализа.
run.analysisFrames | Кадров взято в анализ.
run.trackerFrames | Кадров обработано трекером (после init/lost/coast).
run.stabSkip.init | Кадров без трекера: стабилизатор в состоянии init (поиск).
run.stabSkip.lost | Кадров без трекера: стабилизатор потерян.
run.stabSkip.coast | Кадров без трекера: стабилизатор держит по прогнозу.
run.analysisFps | Частота анализа, кадров на секунду видео.
run.trackerFps | Частота кадров трекера, на секунду видео.
run.anIvShare | Доли кадров по интервалам анализа (ключи вида «33ms»).
run.anIvMedianMs | Медианный интервал анализа, мс.
run.overloadShare | Доля кадров в режиме перегрузки.
run.procMsAvg | Средняя длительность обработки кадра, мс.
run.procMsMax | Максимальная длительность обработки кадра, мс.
run.hookMsPerFrame | Время диагностики на один проанализированный кадр, мс.
run.detCalls | Вызовов детектора машин.
run.detCallsPerSec | Вызовов детектора на секунду видео (каденс; цепочки рамок от него зависят).
run.detMsEma | Средняя длительность вызова детектора, мс.
run.detDelegate | Чем считает детектор (GPU или CPU).
run.refinedShare | Доля блобов, у которых кромка уточнена.
run.refineOffEvents | Сколько раз уточнение кромки отключалось.
run.refineRetries | Сколько раз его включали повторно.
run.refineOffNow | 1 — уточнение кромки сейчас отключено.
run.dupFrameShare | Доля кадров с повторной меткой времени.
run.timeGridOffShare | Доля интервалов между кадрами, не лежащих на сетке кадров источника (отклонение больше 25 %).
run.comparable | true — прогон пригоден для сравнения с другими.
run.notComparableWhy | Причины, по которым сравнивать нельзя (пусто, если comparable).
hook.totalMs | Время всех хуков диагностики за прогон, мс.
hook.perFrameMs | То же на кадр трекера, мс.
hook.byHook | То же по хукам (pre:/post: имя перехваченного метода Tracker).
xcfg.gapSec | Порог интервала между соседними наблюдениями трека для события time_gap, с.
xcfg.sizeJump | Порог относительного изменения ширины или высоты блоба для события size_jump.
xcfg.evPerType | Лимит записей одного типа сопровождения (area_jump, x_jump, size_jump, time_gap, blob_merged_*, owner_drop_start, det_box_lost, dv_change, cls_change, finish_attempt) на один трек; счётчики по ВСЕМ событиям — поле evCounts строки трека.
xcfg.obsMax | Лимит хранимых наблюдений (блоб → измерение) на трек для разбора HIGH_RMS и раннего/итогового.
xcfg.dShiftPx | Порог рывка позы стабилизатора между кадрами, px: точка с большим рывком считается подверженной стабилизации.
xcfg.swayPx | Порог раскачки (sway), px, для того же признака.
xcfg.hr.minN | Минимум точек в попытке для назначения причины HIGH_RMS (меньше — UNKNOWN).
xcfg.hr.primaryMin | Минимальная оценка главной гипотезы; ниже — UNKNOWN.
xcfg.hr.secondaryMin | Минимальная оценка гипотезы, чтобы её перечислить как вторичную причину.
xcfg.hr.outZ | |z|, при котором точка считается резким выбросом (шкала признака OUTLIER).
xcfg.hr.isoZ | Выброс «изолирован», если у обоих соседей |z| меньше этого порога.
xcfg.hr.sideMin | Минимум точек с каждой стороны при поиске скачка уровня и ступени.
xcfg.hr.farChi | χ (невязка в долях σ точки) ниже порога — невязка согласуется с заявленной точностью (признак FAR_SCALE).
xcfg.hr.farChi2 | Второй порог χ для FAR_SCALE: при его превышении оценка гипотезы снижается.
xcfg.hr.farSg | Медианная σ точки, м, выше которой точки считаются «дальними/грубыми».
xcfg.hr.xjBw | Скачок x в долях ширины блоба, с которого он считается признаком склейки/смены объекта.
xcfg.hr.maxK | Сколько худших точек пробуем убрать при проверке «сколько точек нужно убрать, чтобы CORE принял итог» (kToPass).
xcfg.ef.unstable | Расхождение ранней скорости с опорной (доля), с которого ранняя скорость считается нестабильной (EARLY_UNSTABLE).
xcfg.ef.liveSpread | Порог разброса живой скорости (доля) для того же класса.
xcfg.ef.goodChi | χ, ниже которого подгонка по ранним точкам считается «здоровой» (LATE_SPOILED).
xcfg.ef.lostPtsAfter | Число точек после ранней скорости, ниже которого считается, что машина потеряна (VEHICLE_LOST).
xcfg.ef.minScore | Минимальная оценка класса «ранняя → итог»; ниже — UNKNOWN.
tables.events | Журнал событий: rows, cap, dropped.
tables.frames | Таблица frames: rows, cap, dropped.
tables.blobs | Таблица blobs: rows, cap, dropped.
tables.trackFrames | Таблица trackFrames: rows, cap, dropped.
tables.detector | Таблица detector: rows, cap, dropped.
tables.rejectedCandidates | Таблица rejectedCandidates: rows, cap, dropped.
tables.trackRows | Строки треков (таблица tracks): rows, cap, dropped.
tables.hrInstances | Разборы HIGH_RMS: rows, cap, dropped.
tables.attemptPoints | Точки попыток (hrPoints): rows, cap, dropped.
tables.speedAttempts | Попытки итоговой оценки (attempts): rows, cap, dropped.
tables.earlyFinal | Досье «ранняя → итог»: rows, cap, dropped.
tables.trackObservations | Наблюдения треков (внутренняя таблица): rows — сколько всего, cap — лимит на трек, dropped — сколько не сохранено.
tables.candidatesPerFrame | Внутренний буфер кандидатов кадра: rows, cap, dropped.
drops.events | Сколько событий не попало в журнал событий (лимит или резерв для важных событий).
drops.eventsByType | Какие типы событий не попали и сколько каждого.
drops.evPerTrackCap | Сколько событий сопровождения не записано из-за лимита xcfg.evPerType на трек и тип (полные счётчики — в строке трека).
drops.hrCauseNoInstance | Сколько треков имеют HIGH_RMS в причине, но без разобранного экземпляра (строка трека: hrCause=NO_INSTANCE).
drops.frames | Сколько кадров не попало в таблицу frames.
drops.blobs | Сколько блобов не попало в таблицу blobs.
drops.trackFrames | Сколько строк не попало в trackFrames.
drops.detector | Сколько рамок не попало в detector.
drops.rejectedCandidates | Сколько кандидатов не попало в rejectedCandidates.
drops.trackRows | Сколько строк треков не сохранено.
drops.hrInstances | Сколько разборов HIGH_RMS не сохранено.
drops.attemptPoints | Сколько точек попыток не сохранено.
drops.speedAttempts | Сколько попыток итоговой оценки не сохранено.
drops.earlyFinal | Сколько досье «ранняя → итог» не сохранено.
drops.trackObservations | Сколько наблюдений треков не сохранено.
drops.candidatesPerFrame | Сколько кандидатов кадра отброшено буфером.
drops.other | Потери в неклассифицированных буферах (должно быть 0).
profile.wallS | Реальное время с начала замера, с.
profile.aw | Ширина кадра анализа, px.
profile.ah | Высота кадра анализа, px.
profile.anIvMs | Интервал анализа, мс.
profile.analyzedFps | Измеренная частота анализа, к/с.
profile.sourceFps | Измеренная частота источника, к/с.
profile.nProc | Сколько кадров обработано приложением.
profile.stabEstSkipped | Кадров, где пропущена только оценка позы стабилизатора.
profile.blobs | Блобов в последнем кадре.
profile.tracks | Треков в последнем кадре.
profile.vd | Детектор машин: calls — вызовов, lastMs — длительность последнего, st — состояние.
profile.rej | Счётчики отказов приложения: ключ — код отказа трека (REJECT_… с подпричиной) или фильтра блобов, значение — сколько раз.
profile.cn | Счётчики трекера CORE: frag, dup, laneSw, xlaneBlocked, recover, boxDup, reset, err, limboExp, xlaneUnion, ptBad, hold.
profile.fn | Воронка v4 (то же, что funnel.v4).
profile.fast | Контрфактический счёт закончившихся треков по диапазонам лучшей скорости (<60, 60-100, 100-130, 130-160, 160+): n — треков, trk — из них с тремя и более точками, gate — у скольких воспроизведение показало бы число по воротам, live — по живой регрессии, shown — число реально показано, final — получен итог.
profile.ms | Зарезервировано (пусто).

#pointAttribution
КАК ЧИТАТЬ | Раздел отвечает на вопрос «какие измерения создают большие невязки». Для каждого трека с восемью и более точками берётся устойчивая прямая C (метод Тейла–Сена по ВСЕМ точкам трека, включая отброшенные онлайн); z = |невязка точки от C| / σ точки. Точки раскладываются по классам треков и по контекстам. Сравнивайте класс HIGH_RMS с PASS1 по одному и тому же контексту: контекст объясняет большие невязки, если доля точек с z > 3 при нём заметно выше, чем без него, и контекст не присутствует на всех точках подряд.
tracks | Сколько треков вошло в каждый класс (JSON: pointAttribution.tracks).
bins | Границы интервалов z в гистограмме h: ≤1, ≤2, ≤3, ≤5, ≤10, >10.
table | JSON: pointAttribution.table[класс][контекст] = {n, h, z2}.
table.n | Сколько точек имеют этот контекст.
table.h | Шесть чисел: сколько из них попало в каждый интервал z (см. bins). Доля z > 3 = сумма трёх последних / n.
table.z2 | Сумма z² этих точек (z² каждой точки ограничено 10000). Вклад контекста в общую сумму = z2 / z2 контекста ALL.
класс PASS1 | Треки с проверенным итогом T1.
класс PASS2 | Треки только с предварительным итогом T2.
класс HIGH_RMS | Треки, закончившиеся отказом HIGH_RMS, HIGH_REL_ERR, RMS_AND_REL или UNVERIFIED.
класс OTHER | Остальные треки (дубли, мало точек, не подтверждены и т.д.), у которых хватило точек.
ALL | Все точки класса.
noFlag | Точки без единого флага контекста блоба (из списка флагов точки ниже).
soft | Флаг точки: обрезанный блоб, кромка принята с большей σ.
weak | Флаг точки: блоб оставлен как слабый кандидат благодаря рамке детектора.
refined | Флаг точки: кромка уточнена.
det | Флаг точки: под блобом была рамка детектора.
merged | Флаг точки: блоб склеен из нескольких.
ownerDrop | Флаг точки: часть площади блоба отброшена владельцем кластера.
areaJump | Флаг точки: площадь блоба скачком изменилась относительно предыдущего наблюдения.
xJump | Флаг точки: координата x скачком изменилась.
afterMiss | Флаг точки: точка получена сразу после пропуска.
clipped | Флаг точки: блоб обрезан границей зоны.
laneSw | Флаг точки: точка получена в кадре смены полосы.
zoneFar | Точка в дальней трети зоны калибровки.
zoneMid | Точка в средней трети зоны.
zoneNear | Точка в ближней трети зоны.
first3pts | Одна из трёх первых точек трека.
last3pts | Одна из трёх последних точек трека.
gatedOut | Точка отброшена онлайн (tr.bad) как не согласующаяся с прогнозом.
ownerFrac<0.7 | Блоб точки — владелец кластера, в котором были более крупные части (доля площади владельца меньше 0,7).
cls:car | Трек класса car (по голосам рамок детектора).
cls:truck | Трек класса truck.
cls:bus | Трек класса bus.
cls:other | Трек другого или неизвестного класса.
dir:+ | Скорость по устойчивой прямой положительная (машина удаляется по оси s).
dir:− | Скорость по прямой отрицательная (машина приближается).
sgM:≤0.1 | σ точки не больше 0,1 м.
sgM:0.1–0.3 | σ точки от 0,1 до 0,3 м.
sgM:0.3–0.6 | σ точки от 0,3 до 0,6 м.
sgM:>0.6 | σ точки больше 0,6 м (грубая точка: дальняя зона, обрезанный блоб).
obs:none | Для точки не найдено наблюдение блоба (контекст кадра неизвестен).
lane:N | Полоса блоба в кадре точки (N = номер полосы; 0 — вне полос).
size:<0.5лан. | Ширина блоба меньше половины ширины полосы.
size:0.5–0.8лан. | Ширина блоба 0,5–0,8 ширины полосы.
size:0.8–1.1лан. | Ширина блоба 0,8–1,1 ширины полосы.
size:>1.1лан. | Ширина блоба больше 1,1 ширины полосы (склейка или большая машина).
areaStep:first | Первое наблюдение трека (предыдущей площади нет).
areaStep:<0.8 | Площадь упала более чем на 20 % относительно предыдущего наблюдения.
areaStep:>1.25 | Площадь выросла более чем на 25 %.
areaStep:стаб. | Площадь изменилась в пределах −20 %…+25 %.
dt:first | Первое наблюдение трека (интервала нет).
dt:≤0.04с | Интервал до предыдущего наблюдения не больше 0,04 с.
dt:0.04–0.08с | Интервал 0,04–0,08 с.
dt:0.08–0.15с | Интервал 0,08–0,15 с.
dt:>0.15с | Интервал больше 0,15 с (наблюдения прорежены).
jitter:≤0.3px | Рывок позы стабилизатора между кадрами не больше 0,3 px.
jitter:0.3–1px | Рывок 0,3–1 px.
jitter:>1px | Рывок больше 1 px.
sway:≤0.3 | Раскачка камеры (sway) не больше 0,3 px.
sway:0.3–0.5 | Раскачка 0,3–0,5 px.
sway:>0.5 | Раскачка больше 0,5 px.
shift:≤2px | Сдвиг кадра от эталона не больше 2 px.
shift:2–6px | Сдвиг 2–6 px.
shift:>6px | Сдвиг больше 6 px.
afterCoast | Между этим и предыдущим наблюдением стабилизатор хоть раз был в состоянии coast (кадры без измерения позы).
xPos:лево | Блоб в левой трети кадра.
xPos:центр | Блоб в средней трети кадра.
xPos:право | Блоб в правой трети кадра.
det:рамка | Под блобом была рамка детектора (перекрытие не меньше 0,3).
det:без рамки | Рамки детектора под блобом не было.
sizeJump | Размер блоба скачком изменился относительно предыдущего наблюдения (событие size_jump).
#values
КАК ЧИТАТЬ | Раздел описывает значения полей-перечислений (коды причин, стадий, классов). Формат ключа: поле.значение. Коды без префикса REJECT_ берутся из CORE v4 как есть; поля с пометкой «гипотеза» — результат классификатора диагностики, а не измерение.
res.PASS | Трек дал результат (итог T1 или предварительный T2; уровень — поле finalTier).
res.ALIVE | Трек ещё жив (строка снята на момент выгрузки).
res.ENDED | Трек закончен, число показывалось, но итога нет, и CORE не записал код отказа.
res.NEVER_SHOWN | Трек закончен, число не показывалось, кода отказа нет.
res.REJECT_DUPLICATE | Трек признан дублем другого (общий блоб, осколки под одной рамкой детектора) и убит.
res.REJECT_TOO_FEW_POINTS | Точек меньше finalMinPts, а ни ранний итог, ни предварительная оценка не подошли.
res.REJECT_NO_FIT | Регрессию построить нельзя (вырожденный набор точек).
res.REJECT_TOO_SLOW | Скорость по регрессии меньше minSpeedKmh.
res.REJECT_HIGH_RMS | RMS регрессии больше finalMaxRmsM (подпричина CORE после двоеточия: FAR_SCALE, OUTLIER, JUMP, SYSTEMATIC, NOISE).
res.REJECT_HIGH_REL_ERR | Относительная ошибка наклона больше showErr (подпричина как у HIGH_RMS).
res.REJECT_RMS_AND_REL | Одновременно превышены RMS и относительная ошибка (подпричина как у HIGH_RMS).
res.REJECT_NO_CONFIRM | Трек не показывался и не набрал условий «непоказанного» итога (подтверждение детектором, ошибка, RMS, путь).
res.REJECT_SPEED_SPREAD | Разброс живой скорости больше maxSpreadKmh, а устойчивая оценка и арбитр не спасли.
res.REJECT_TOO_SHORT_PATH | Путь меньше minTravelM, а спасение и предварительная оценка не подошли.
res.REJECT_UNVERIFIED | Результат построен, но не прошёл проверку половин и эффективной ошибки (подпричина — valWhy: REL_EFF, NO_HALVES, SPREAD).
cause | Причина итога трека (то же, что res, но без префикса REJECT_ и с уточнениями): PASS, ALIVE, DUPLICATE, GAP_RESET (разрыв видео, трек сброшен), FLUSH_VIDEO_END / FLUSH_STAB_LOST / FLUSH_BG_RESET / FLUSH_OTHER (трек закрыт принудительно: конец видео, потеря стабилизации, сброс фона), NO_CONFIRM_FRAMES (прожил меньше confirmFrames), NO_MOVE (не двигался), либо код отказа CORE без REJECT_ с подпричиной через двоеточие.
endBy.miss | Трек закончен: слишком долго не было блоба.
endBy.occluded | Трек закончен: перекрыт другой машиной.
endBy.gap | Трек закончен: разрыв во времени кадров (сброс).
endBy.flush | Трек закрыт принудительно (конец видео, потеря стабилизатора, сброс фона).
endBy.dup | Трек убит как дубль.
stageReached.BORN | Трек родился, но подтверждения нет.
stageReached.CONFIRMED | Подтверждён (двигался, confirmFrames кадров), число не показывалось.
stageReached.SHOWN | Показано число по регрессии (не раннее), итога нет.
stageReached.EARLY | Показана ранняя скорость по воротам, итога нет.
stageReached.PROV | Получен предварительный итог T2.
stageReached.FINAL | Получен проверенный итог T1.
stageLost.CONFIRM | Потерян на переходе «рождён → подтверждён».
stageLost.SHOW | Потерян на переходе «подтверждён → число показано».
stageLost.FINAL | Потерян на переходе «число показано → итог T1» (итога нет или только T2).
stageLost.OPEN | Трек ещё идёт, судить рано.
stageLost.пусто | Итог T1 получен, потери нет.
notShownWhy.NO_POINTS | Ни одной точки регрессии не набрано; после двоеточия — самая частая причина отсутствия точки: TOUCHING (блоб касается нижнего края), CLIPPED (обрезан границей зоны), BEYOND_ZONE (кромка дальше рабочей зоны), NO_S (метрическая координата не определена). Гипотеза по состоянию на конец трека.
notShownWhy.FEW_PTS<3 | Меньше трёх точек.
notShownWhy.NOT_MOVED | Трек не сдвинулся на minMovePx.
notShownWhy.LIVE_NEVER_COMPUTED | Окно живой скорости ни разу не набралось (короче minWinSec).
notShownWhy.LIVE_UNRELIABLE | Живая скорость считалась, но каждый раз отбраковывалась: rel — по относительной ошибке, rms — по RMS (в скобках числа отказов).
notShownWhy.PATH<minShow | Путь меньше минимального для показа.
notShownWhy.WIN<minShow | Окно по времени короче минимального для показа.
notShownWhy.UNSTABLE | Скорость была, но не держалась стабильной showStable кадров подряд.
notShownWhy.PTS<showMin | Точек меньше minShowPts.
notShownWhy.SLOW | Скорость ниже minSpeedKmh.
notShownWhy.UNKNOWN | Ни одно из известных условий не найдено.
earlyWhy.OFF | Ранняя оценка (early) выключена в CONFIG.
earlyWhy.FEW_PTS | Точек меньше early.minPts.
earlyWhy.NOT_MOVED | Трек не двигался.
earlyWhy.NOT_CAR | Нет признаков машины (рамка детектора или не меньше двух попаданий класса).
earlyWhy.NO_GATES | Не набрались ворота (пересечения линий ворот) для оценки по воротам.
earlyWhy.KB_RANGE | Скорость по воротам вне диапазона [minSpeedKmh, early.maxKmh].
earlyWhy.PATH | Путь меньше требуемого для ранней оценки.
earlyWhy.FIT_DISAGREE | Скорость по воротам расходится с регрессией больше early.agree.
earlyWhy.C_DISAGREE | Скорость по воротам расходится с устойчивой оценкой C больше early.agree.
earlyWhy.CONDITIONS_MET_NOT_SHOWN | Все зеркальные условия выполнены, но CORE число не показал (расхождение зеркала с CORE — проверяйте mirrorOk).
obs.st.PT | Из блоба получена точка регрессии.
obs.st.GATED | Точка получена, но отброшена онлайн (tr.bad) как не согласующаяся с прогнозом.
obs.st.NOPT:TOUCHING | Точки нет: блоб касается нижнего края кадра.
obs.st.NOPT:CLIPPED | Точки нет: блоб обрезан границей зоны (и не годится как soft).
obs.st.NOPT:BEYOND_ZONE | Точки нет: кромка дальше рабочей зоны калибровки.
obs.st.NOPT:NO_S | Точки нет: метрическая координата не определена.
show.mode.gate | Число показано РАННИМ способом — по воротам (Tracker._early).
show.mode.wls | Число показано по живой регрессии.
conf.low | Низкая уверенность живого числа.
conf.mid | Средняя уверенность.
conf.high | Высокая уверенность.
status.FINAL | Итог T1: обычная регрессия прошла все проверки.
status.FINAL_ROB | Итог T1: по очищенным точкам (устойчивая оценка) с прежними порогами.
status.SHORT | Итог T1: короткий трек (точек меньше finalMinPts), у которого скорость по воротам прошла все проверки короткого итога (shortWhy пусто).
status.ARB | Предварительный итог T2: арбитр оценок A/B/C.
status.PROV | Предварительный итог T2: провизорная оценка.
status.UNVERIFIED | Предварительный итог T2: регрессия посчитана, но не прошла проверку половин или эффективной ошибки (valWhy); уверенность low.
status.SHORT_GATE | Предварительный итог T2: короткий трек (точек меньше finalMinPts), выдана скорость по воротам с низкой уверенностью, потому что одна из проверок короткого итога не прошла (shortWhy).
tier.1 | Проверенный итог (FINAL, FINAL_ROB, SHORT) — учитывается в основной воронке.
tier.2 | Предварительный итог (ARB, PROV, UNVERIFIED, SHORT_GATE) — в итоги не входит, считается отдельно.
tier.0 | Попытка без результата.
robWhy | Почему не принят итог по очищенным точкам: OFF (выключен), FEW_PTS, NO_FIT, FEW_INLIERS, RMS_I, CHI_I, REL_I, PATH_I, RANGE (диапазон скорости), SPREAD_I / SPREAD_W (расхождение половин трека), NO_HALVES (нет половин), AB_CONFLICT (методы A и B расходятся), NO_B_SPREAD (нет B и половины не близки), NO_CONFIRM.
arbWhy | Почему не принят арбитр A/B/C: OFF, FEW_PTS, NOT_MOVED, AB_CHI, C_SPREAD, PATH, RANGE, VETO_A, VETO_C.
provWhy | Почему не принята предварительная оценка: OFF, FEW_PTS, NOT_MOVED, NOT_CAR, PATH, RANGE, NO_PROV, VETO_A, VETO_C.
valWhy | Почему не прошла проверка итога: REL_EFF (эффективная ошибка больше valRelEff), NO_HALVES (нет половин), SPREAD (расхождение половин больше valSpread).
shortWhy | Почему не принят короткий итог: FEW_PTS, NO_FIT, CHI, REL_EFF, AB.
hrCause.OUTLIER | Гипотеза: одна-две изолированные точки с большой невязкой; без них итог проходит.
hrCause.JUMP | Гипотеза: скачок уровня или ступень в ряду точек (склейка, смена объекта, скачок кромки).
hrCause.FAR_SCALE | Гипотеза: невязка согласуется с заявленной точностью точек (χ ≤ порога): точки грубые (дальняя зона), а лимит RMS в метрах для них слишком строг.
hrCause.SYSTEMATIC | Гипотеза: невязки коррелированы по времени (автокорреляция, кривизна): модель «прямая» не описывает движение.
hrCause.NOISE | Гипотеза: шум без структуры.
hrCause.MERGE | Гипотеза: на точках склейка блобов, отброшенные части, скачки площади (механизм «слипшиеся машины»).
hrCause.ID_SWITCH | Гипотеза: трек перепрыгнул между объектами (смена ID, разные цепочки детектора, скачок кромки на стыке).
hrCause.STABILIZATION | Гипотеза: невязки связаны с рывком/качанием позы стабилизатора.
hrCause.UNKNOWN | Ни одна гипотеза не набрала порог (или мало точек): причина не определена. Выставляется, если нет двух независимых сильных признаков.
hrCause.NO_INSTANCE | В причине трека есть HIGH_RMS, но разобранной попытки нет (лимит журнала или попытка не записана).
efClass.FINAL_OK | Итог T1 получен, ранняя скорость с ним согласуется.
efClass.PROV_ONLY | Есть только предварительный итог T2.
efClass.VEHICLE_LOST | Гипотеза: после ранней скорости набрано мало точек, трек закончился потерей — машину потеряли.
efClass.LATE_SPOILED | Гипотеза: ранние точки были хороши, поздние точки испортили трек.
efClass.EARLY_UNSTABLE | Гипотеза: ранняя скорость сама была нестабильной (расходится с опорной, слабая подгонка).
efClass.FILTER_REJECT | Итог отвергнут конкретным фильтром CORE (HIGH_RMS, NO_CONFIRM и т. п.) при нормальных данных.
efClass.UNKNOWN | Ни один класс не набрал порог.
chain.res.FINAL | У цепочки есть трек с итогом T1.
chain.res.PROV | Есть только итог T2.
chain.res.OPEN | Цепочка ещё идёт (или закончилась менее 1,2 с назад).
chain.res.REJECTED | Треки были, итога нет.
chain.res.NO_TRACK | Треков нет.
chain.why.BLOB_NOT_TRACKED | Блобы в рамках цепочки были, но ни один не стал треком.
chain.why.NO_MOTION_BLOB | В рамках цепочки не было блоба движения (машина не выделена детектором движения).
chain.why.REJECT_SMALL_BLOB | Кандидат в рамке отвергнут как мелкий (после двоеточия — какие фильтры: area, width, height, area2).
chain.why.REJECT_BAD_FILL | Кандидат в рамке отвергнут по заполненности.
lossDet.IN_BOX | В момент потери прогноз трека лежал внутри рамки детектора: детектор машину видел.
lossDet.NEAR | Рамка детектора рядом с прогнозом (до 40 px).
lossDet.FAR | Ближайшая рамка далеко.
lossDet.NO_BOX | Рамок детектора не было.
ptFlag.soft | Точка из обрезанного блоба (σ больше).
ptFlag.weak | Блоб оставлен как слабый кандидат благодаря рамке детектора.
ptFlag.refined | Кромка уточнена.
ptFlag.det | Под блобом рамка детектора.
ptFlag.merged | Блоб склеен.
ptFlag.ownerDrop | Часть площади отброшена владельцем кластера.
ptFlag.areaJump | Скачок площади.
ptFlag.xJump | Скачок координаты x.
ptFlag.afterMiss | Точка сразу после пропуска.
ptFlag.clipped | Блоб обрезан границей зоны.
ptFlag.laneSw | Кадр смены полосы.
stabState.ok | Стабилизатор работает.
