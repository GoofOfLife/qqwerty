<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Скоростемер · v4_DEBUG</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0a0c0f;--panel:#12161b;--panel2:#1a2027;--line:#28303a;--tx:#e8edf3;--mut:#8a95a3;--acc:#4aa3ff;--ok:#35d07f;--warn:#ffd23f;--bad:#ff5a5f;--gate:#3de6d1;--lane:#ffab4d;--r:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#hdr{display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:54px;background:var(--panel);border-bottom:1px solid var(--line)}
.ttl{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#stepNum{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#stepName{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dots{display:flex;gap:6px;margin-left:auto}
#dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
#dots i.on{background:var(--acc);box-shadow:0 0 0 3px rgba(74,163,255,.25)}
#dots i.done{background:#3a6f9c}
.icon{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:21px;flex:none}
#stage{position:relative;overflow:hidden;background:#000;min-height:0;touch-action:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.fitbtn{position:absolute;right:8px;top:8px;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(12,15,19,.78);font-size:21px;z-index:4}
#laneTabs{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4}
#laneTabs .seg button{min-width:58px}
#loupe{position:absolute;z-index:5;width:132px;height:132px;border:2px solid var(--gate);border-radius:14px;overflow:hidden;background:#000;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.65)}
#lcv{display:block}
#panel{display:flex;flex-direction:column;gap:8px;background:var(--panel);border-top:1px solid var(--line);max-height:50vh;max-height:50dvh;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#hint{font-size:14px;color:#c4ced9;line-height:1.38}
#body{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1;padding:2px 0;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#nav{display:flex;gap:10px}
#nav .btn{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-weight:650;text-decoration:none;text-align:center}
.btn:active{filter:brightness(1.25)}
.btn.primary{background:var(--acc);border-color:transparent;color:#04121f}
.btn.go{background:var(--ok);border-color:transparent;color:#03160c;font-size:18px;font-weight:800}
.btn.small{min-height:44px;padding:6px 12px;font-size:14px}
.btn.sq{min-width:58px;font-size:18px}
.btn.danger{color:#ffb3b5;border-color:#5a2a2d}
.btn:disabled{opacity:.5}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#kp.on{display:grid}
#kp button{min-height:54px;font-size:22px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--tx)}
#kp button.ok{grid-row:span 2;background:var(--acc);color:#04121f;border-color:transparent;font-size:18px}
#kp button.z{grid-column:span 3}
.big2{min-height:66px;font-size:19px;font-weight:800}
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:94px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel2);font-size:17px;font-weight:750}
.big.on{border-color:var(--acc);background:#13283b}
.bi{font-size:30px;line-height:1}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ct{font-weight:700;font-size:14px;color:#c4ced9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.tight{gap:6px;flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:8px}
.fl{font-size:14px;color:#c4ced9}
.status{font-size:13.5px;line-height:1.42;padding:9px 11px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:#c4ced9;-webkit-user-select:text;user-select:text}
.status.ok{border-color:#1f5a3c;background:#112419;color:#a7f0c6}
.status.warn{border-color:#6a5a1c;background:#241f0e;color:#ffe58a}
.status.bad{border-color:#6a2a2d;background:#2a1214;color:#ffb3b5}
.badtxt{color:var(--warn)}
input[type=text],select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#0e1216;color:var(--tx);padding:8px 12px;font:inherit;-webkit-user-select:text;user-select:text}
.fld{display:flex;flex-direction:column;gap:4px}
.fi{display:flex;align-items:center;gap:8px}
.fi em{font-style:normal;color:var(--mut);min-width:34px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.sb{width:50px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:24px;font-weight:700}
.sv{min-width:30px;text-align:center;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0e1216;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:650;color:var(--mut)}
.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:0 0 0 1px var(--acc) inset}
.rng{width:100%;accent-color:var(--acc);height:38px}
.tm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
.dl{font-variant-numeric:tabular-nums;color:var(--gate);font-weight:750;min-width:70px;text-align:right}
.pair{gap:10px}
.lane{flex-wrap:nowrap}
.lane input{flex:1 1 0;min-width:0}
.lane select{width:auto;flex:0 0 38%}
.chip2{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:10px;background:#3a2a14;color:var(--lane);font-weight:800;flex:none}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lb{min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:20px;font-weight:800}
.lb.on{background:var(--acc);color:#04121f;border-color:transparent}
.limitbox{display:flex;flex-direction:column;gap:10px}
.nudge{flex-direction:row;align-items:center;justify-content:space-between}
#hud{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));pointer-events:none}
.hrow{display:flex;gap:6px;flex-wrap:wrap}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:12px;background:rgba(10,12,15,.76);border:1px solid rgba(255,255,255,.13);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:13px;color:#dfe6ee;min-height:38px;white-space:nowrap}
.chip b{font-size:16px;font-variant-numeric:tabular-nums}
.chip small{font-size:11px;color:var(--mut)}
.chip.btn{border-color:rgba(255,255,255,.2);font-weight:700}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;background:#6b7684;display:inline-block}
.st-ok .dot{background:var(--ok)}
.st-init .dot{background:var(--warn)}
.st-coast .dot{background:var(--warn)}
.st-lost .dot{background:var(--bad);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.3}}
#stageMsg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;max-width:86%;text-align:center;padding:12px 16px;border-radius:14px;background:rgba(10,12,15,.82);border:1px solid rgba(255,255,255,.16);font-weight:700;font-size:17px;line-height:1.3;pointer-events:none}
#levelBox{position:absolute;left:8px;top:8px;z-index:6;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:rgba(10,12,15,.76);border:1px solid rgba(255,255,255,.14);font-weight:750;font-variant-numeric:tabular-nums;pointer-events:none;color:var(--mut)}
.run #levelBox{top:calc(104px + env(safe-area-inset-top))}
.lvline{width:48px;height:3px;border-radius:2px;background:currentColor;transition:transform .12s linear}
#levelBox.ok{color:var(--ok)}
#levelBox.warn{color:var(--warn)}
#levelBox.bad{color:var(--bad)}
#fileBar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.12);z-index:7}
#fileBar i{display:block;height:100%;width:0;background:var(--acc)}
#drawer{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;max-height:64%;background:rgba(14,17,21,.96);border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(calc(100% - 56px - env(safe-area-inset-bottom)));transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
#drawer.open{transform:none}
#drawerBar{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 16px;border:0;background:transparent;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:left;flex:none}
#drawerBar i{font-style:normal;transition:transform .25s}
.open #drawerBar i{transform:rotate(180deg)}
#drawerBody{overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;touch-action:pan-y}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sc{background:var(--panel2);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.sc b{font-size:19px;font-variant-numeric:tabular-nums}
.sc small{font-size:10.5px;color:var(--mut)}
.prow{display:grid;grid-template-columns:78px 40px 26px 1fr 28px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.prow.hasSnap{cursor:pointer}
.pk{font-size:18px;text-align:left}
.pt{color:var(--mut);font-size:14px}
.pl{font-weight:700}
.empty{color:var(--mut);padding:12px 4px;text-align:center}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.scard{width:min(560px,100%);max-height:88vh;max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.shead button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:18px}
.sets{display:flex;flex-direction:column;gap:10px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px}
.swt{display:flex;flex-direction:column}
.swt small{color:var(--mut);font-size:12.5px}
.sw{position:relative;width:54px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0}
.sw i{position:absolute;inset:0;border-radius:16px;background:#2a323c;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(22px)}
.fine{font-size:12px;line-height:1.5;color:var(--mut);margin:6px 0 0;-webkit-user-select:text;user-select:text}
.snap img{width:100%;border-radius:12px;display:block;margin-bottom:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(12px);z-index:80;max-width:92vw;padding:11px 15px;border-radius:12px;background:#222a34;border:1px solid #3a4452;color:#eef3f8;font-size:14px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.running #toast{bottom:calc(env(safe-area-inset-bottom) + 74px)}
#app.run{grid-template-rows:minmax(0,1fr);padding:0}
#app.run #hdr,#app.run #panel{display:none}
@media (orientation:landscape){
  #app:not(.run){grid-template-columns:minmax(0,1fr) minmax(310px,38%);grid-template-rows:auto minmax(0,1fr)}
  #app:not(.run) #hdr{grid-column:1/-1}
  #app:not(.run) #stage{grid-column:1;grid-row:2}
  #app:not(.run) #panel{grid-column:2;grid-row:2;max-height:none;border-top:0;border-left:1px solid var(--line)}
  #drawer{max-height:78%}
}
@media (max-width:480px){#dots{display:none}}
@media (max-width:480px){.chip{padding:5px 9px;min-height:36px;font-size:12.5px}.chip b{font-size:15px}.hrow{gap:5px}}
@media (max-width:380px){.chip{padding:5px 7px}.prow{grid-template-columns:70px 34px 24px 1fr 24px}}
#btnDbg.on{background:rgba(255,171,77,.28);border-color:#ffab4d;color:#ffe2b5}
#dbgp{position:absolute;left:8px;top:calc(98px + env(safe-area-inset-top));z-index:6;max-width:min(94%,400px);padding:6px 8px;border-radius:10px;background:rgba(10,12,15,.94);border:1px solid rgba(255,171,77,.65);pointer-events:none}
#dbgp pre{margin:0;font:11px/1.38 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e8edf3;white-space:pre-wrap}
#dbgp .dbgRow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;pointer-events:auto}
#dbgp .dbgRow button{min-height:30px;padding:3px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(26,32,39,.92);font-size:11px;font-weight:700}
.dbgAct{display:flex;gap:8px;margin-bottom:10px}
.dbgPre{margin:0 0 10px;font:11.5px/1.38 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto;color:#dfe6ee}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="ttl"><span id="stepNum">1 / 6</span><b id="stepName">Источник</b></div>
    <div id="dots"></div>
    <button id="btnGear" class="icon" type="button" aria-label="Настройки">⚙</button>
  </header>
  <div id="stage">
    <video id="video" playsinline webkit-playsinline muted></video>
    <canvas id="cv"></canvas>
    <button id="btnFit" class="fitbtn" type="button" hidden aria-label="Сбросить масштаб кадра">⤢</button>
    <div id="laneTabs" hidden></div>
    <div id="loupe" hidden><canvas id="lcv"></canvas></div>
    <div id="levelBox" hidden><div class="lvline"></div><span>—</span></div>
    <div id="stageMsg" hidden></div>
    <div id="fileBar" hidden><i></i></div>
    <div id="hud" hidden>
      <div class="hrow">
        <div class="chip" id="chFps"><b>—</b><small>fps</small></div>
        <div class="chip st-off" id="chStab"><i class="dot"></i><span>стаб.</span></div>
        <button class="chip btn" id="chLimit" type="button"><b>50</b><small>лимит</small></button>
        <div class="chip" id="chCnt"><b>0</b><small>проездов</small></div>
      </div>
      <div class="hrow">
        <button class="chip btn" id="btnRestart" type="button" hidden aria-label="Заново">↺</button>
        <button class="chip btn" id="btnPause" type="button">⏸ Пауза</button>
        <button class="chip btn" id="btnReconf" type="button">⚙ Перенастроить</button>
<button class="chip btn" id="btnDbg" type="button">DEBUG</button>
        <button class="chip btn" id="btnMenu" type="button" aria-label="Меню">☰</button>
      </div>
    </div>
    <div id="drawer" hidden>
      <button id="drawerBar" type="button"><span id="drawerSum">Проезды: пока нет</span><i>▲</i></button>
      <div id="drawerBody"><div id="stats"></div><div id="plist"></div></div>
    </div>
  </div>
  <section id="panel">
    <div id="hint"></div>
    <div id="body"></div>
    <div id="nav"><button id="btnBack" class="btn" type="button" hidden>Назад</button><button id="btnNext" class="btn primary" type="button">Далее</button></div>
  </section>
</div>
<div id="sheet" class="sheet" hidden><div class="scard"><div class="shead"><b id="sheetTitle"></b><button id="sheetClose" type="button" aria-label="Закрыть">✕</button></div><div id="sheetBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="fileIn" type="file" accept="video/*" hidden>
<script>
"use strict";
/* ПРАВИЛА ПРОЕКТА (в приложенной версии текста правил не оказалось — здесь записи этой части; новые поля S и функции дописывать сюда)
 * S.lanes.n — общее число полос (шаги 3 и 4, setLaneCount). S.gates — общий набор {n,v,aim,mode,markM,steps,meters,sel}
 *   + perLane (режим «свои ворота»), lane (выбранная полоса, с 0), L[] (наборы по полосам того же вида).
 * S.calibs[i] — калибровка полосы i (в общем режиме все элементы — один объект), S.calib — выбранной полосы.
 *   Калибровка: {a,b,c,rms,vNear,vFar,sMax,...}; зона полосы — от vNear (низ кадра) до vFar (последние ворота + 10 %).
 * Наклон ворот: g.rot[i] — угол линии ворот i (рад., + = правая сторона ниже), поворот вокруг кольца aim; v — строка в точке кольца.
 *   Калибровка идёт по строкам опорной колонки XR (gateVr); cal.til = tiltOf(g) — семейство наклонных линий; v трекера = tiltV(til, x, y).
 * Функции: GS(i), fixSet, cloneSet, recalc, calsOk, lanePre, lanePath, laneTabs, packSet/readSet, analysisH;
 *   CORE: calAt/sOfV/vOfS(cals, …, индекс полосы), wlsLine; Tracker._sample/_live (σ точки, окно, фильтр).
 * CFG.* из ТЗ = CONFIG.track.*: edgeSigmaPx, maxRelErr, showErr, minWinSec, winMaxSec, maxAccel, maxPxMeters.
 */
/* ==== CORE:BEGIN ==== */
const CONFIG = {
  // ---------- Кадр и камера ----------
  analysisWidth: 640,          // размер кадра анализа по длинной стороне, px
  smoothing: 'medium',         // качество уменьшения кадра: low | medium | high
  camera: { width: 1920, height: 1080, fps: 60 }, // желаемый режим камеры
  maxFrameSide: 4096,          // макс. сторона замороженного кадра, px
  // ---------- Калибровка (ворота) ----------
  calib: {
    minGates: 3, maxGates: 6, defaultGates: 4,
    minSpanM: 10,              // предупреждение, если крайние ворота ближе друг к другу, м
    warnRmsPct: 5,             // предупреждение, если невязка больше, % от базы
    rangeFactor: 1.1,          // зона полосы: от нижнего края кадра до s последних ворот × это число (+10 %)
    refineIters: 3,            // доуточнение МНК весами (0 — чистый МНК)
    rulerStepM: 5,             // шаг линейки проверки, м
    defaultMarkM: 6,           // шаг разметки по умолчанию, м (штрих + промежуток)
    minGap: 0.004              // мин. зазор между воротами (доля высоты кадра)

const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
function median(a) {
  if (!a.length) return 0;
  const s = Array.from(a).sort((x, y) => x - y), n = s.length;
  return n % 2 ? s[n >> 1] : 0.5 * (s[n / 2 - 1] + s[n / 2]);
}

function solve3(M, y) {
  const A = [M[0].concat(y[0]), M[1].concat(y[1]), M[2].concat(y[2])];
  let scale = 0;
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) scale = Math.max(scale, Math.abs(M[i][j]));
  if (!(scale > 0)) return null;
  for (let c = 0; c < 3; c++) {
    let p = c;
    for (let r = c + 1; r < 3; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-12 * scale) return null;
    if (p !== c) { const t = A[p]; A[p] = A[c]; A[c] = t; }
    for (let r = c + 1; r < 3; r++) {
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 4; k++) A[r][k] -= f * A[c][k];
    }
  }
  const x = [0, 0, 0];
  for (let i = 2; i >= 0; i--) {
    let s = A[i][3];
    for (let k = i + 1; k < 3; k++) s -= A[i][k] * x[k];
    x[i] = s / A[i][i];
  }
  return x;
}

/* ---------- Калибровка: s(v) = (a v + b) / (c v + 1) ---------- */
function fitProjective(vs, ss, refine) {
  const n = vs.length, w = new Array(n).fill(1);
  let sol = null;
  const iters = 1 + Math.max(0, refine | 0);
  for (let it = 0; it < iters; it++) {
    const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], y = [0, 0, 0];
    for (let i = 0; i < n; i++) {
      const r = [vs[i], 1, -vs[i] * ss[i]], w2 = w[i] * w[i];
      for (let p = 0; p < 3; p++) {
        y[p] += w2 * r[p] * ss[i];
        for (let q = 0; q < 3; q++) M[p][q] += w2 * r[p] * r[q];
      }
    }
    const x = solve3(M, y);
    if (!x) return sol;
    sol = { a: x[0], b: x[1], c: x[2] };
    for (let i = 0; i < n; i++) {
      const den = Math.abs(sol.c * vs[i] + 1);
      w[i] = den > 1e-6 ? 1 / den : 1;
    }
  }
  return sol;
}

// vs — строки ворот (доли высоты кадра), от ближних (большое v) к дальним; ds — расстояния между соседними, м
function makeCalib(vs, ds, cfg) {
  cfg = cfg || CONFIG.calib;
  const n = vs.length;
  const out = { ok: false, err: null, warns: [], vs: vs.slice(), ss: [0] };
  for (let i = 1; i < n; i++) out.ss.push(out.ss[i - 1] + (ds[i - 1] || 0));
  for (let i = 1; i < n; i++) {
    if (!(ds[i - 1] > 0)) { out.err = 'Расстояние между воротами ' + i + ' и ' + (i + 1) + ' должно быть больше 0.'; return out; }
    if (!(vs[i] < vs[i - 1] - 1e-5)) { out.err = 'Ворота должны идти снизу вверх без пересечений (проверь ворота ' + i + ' и ' + (i + 1) + ').'; return out; }
  }
  const fit = fitProjective(vs, out.ss, cfg.refineIters);
  if (!fit) { out.err = 'Не удалось подобрать масштаб: ворота расставлены вырожденно.'; return out; }
  const { a, b, c } = fit;
  const sLast = out.ss[n - 1], sMax = cfg.rangeFactor * sLast;
  const sOf = v => (a * v + b) / (c * v + 1);
  const vOf = s => (b - s) / (s * c - a);
  if (!(a - b * c < 0)) { out.err = 'Расстояние не растёт вверх по кадру. Проверь порядок ворот и введённые расстояния.'; return out; }
  const dd = sMax * c - a;
  if (!isFinite(dd) || Math.abs(dd) < 1e-9) { out.err = 'Рабочий диапазон уходит за горизонт. Сдвинь верхние ворота ниже или проверь расстояния.'; return out; }
  let vFar = (b - sMax) / dd;
  const sg = Math.sign(c * vs[0] + 1) || 1;
  if (!isFinite(vFar) || (c * 1 + 1) * sg <= 0 || (c * vFar + 1) * sg <= 0 || vFar >= vs[n - 1]) {
    out.err = 'Горизонт попадает в рабочий диапазон: масштаб неверный. Сдвинь верхние ворота ниже или проверь расстояния между воротами.';
    return out;
  }
  vFar = Math.max(vFar, 0.02);
  let se = 0;
  for (let i = 0; i < n; i++) { const r = sOf(vs[i]) - out.ss[i]; se += r * r; }
  out.rms = Math.sqrt(se / n);
  out.rmsPct = sLast > 0 ? 100 * out.rms / sLast : 0;
  out.exact = n <= 3;
  if (!out.exact && out.rmsPct > cfg.warnRmsPct) out.warns.push('Невязка калибровки ' + out.rmsPct.toFixed(1) + '% больше ' + cfg.warnRmsPct + '%: точки ворот стоят не на одной линии вдоль дороги или расстояния введены неточно.');
  if (sLast < cfg.minSpanM) out.warns.push('Расстояние между крайними воротами меньше ' + cfg.minSpanM + ' м — точность масштаба снизится.');
  Object.assign(out, { ok: true, a, b, c, sOf, vOf, vNear: 1, vFar, sMax, sBottom: sOf(1), sLast });
  return out;
}

// Калибровка полосы li (с 0); cals[i] — калибровка полосы i, в общем режиме все элементы — один объект
const calAt = (cals, li) => cals[clamp(li | 0, 0, cals.length - 1)];
const sOfV = (cals, v, li) => calAt(cals, li).sOf(v);
const vOfS = (cals, s, li) => calAt(cals, li).vOf(s);

/* ---------- Геометрия полос ---------- */
const XR = 0.5;   // опорная колонка (доля ширины): калибровка ведётся по строкам кадра в этой колонке
// Наклон ворот → { xr, vr[], ks[], span } по возрастанию vr; ks — dv/dx в долях кадра (tgθ·ширина/высота). null, если все ворота горизонтальны
function tiltOf(g, asp) {
  const rot = g.rot || [], P = []; let any = false;
  for (let i = 0; i < g.n; i++) {
    const th = +rot[i] || 0, ks = Math.tan(th) * asp;
    if (Math.abs(th) > 1e-4) any = true;
    P.push({ vr: g.v[i] + ks * (XR - g.aim[i]), ks });
  }
  if (!any) return null;
  P.sort((p, q) => p.vr - q.vr);
  return { xr: XR, vr: P.map(p => p.vr), ks: P.map(p => p.ks), span: 0.5 * Math.max(...P.map(p => Math.abs(p.ks))) };
}
function tiltK(til, vr) {   // наклон семейства линий на опорной строке vr: линейная интерполяция между воротами, за крайними — постоянный
  const V = til.vr, K = til.ks, n = V.length;
  if (vr <= V[0]) return K[0];
  if (vr >= V[n - 1]) return K[n - 1];
  let i = 1; while (V[i] < vr) i++;
  return K[i - 1] + (K[i] - K[i - 1]) * (vr - V[i - 1]) / (V[i] - V[i - 1]);
}
const tiltY = (til, x, vr) => vr + tiltK(til, vr) * (x - til.xr);   // строка кадра, где линия семейства vr проходит через колонку x
function tiltV(til, x, y) {   // обратно: точка (x, y) → строка vr опорной колонки на той же линии семейства (деление пополам: устойчиво, даже если наклон меняется быстро)
  const dx = x - til.xr, m = 2 * til.span * Math.abs(dx) + 0.01;
  let lo = y - m, hi = y + m;
  for (let k = 0; k < 26; k++) {
    const mid = 0.5 * (lo + hi);
    if (mid + tiltK(til, mid) * dx < y) lo = mid; else hi = mid;
  }
  return 0.5 * (lo + hi);
}

function xAtY(b, y) {
  const dy = b.y2 - b.y1;
  return Math.abs(dy) < 1e-6 ? b.x1 : b.x1 + (y - b.y1) * (b.x2 - b.x1) / dy;
}

// bounds — N+1 линий {x1,y1,x2,y2} (нормированные). Возвращает карту полос и границы строк.
function buildGeometry(aw, ah, bounds, calib, cfg) {
  cfg = cfg || CONFIG.lanes;
  const N = bounds.length - 1;
  const yTop = Math.max(1, Math.floor((calib.vFar - cfg.detTopMargin) * ah));
  const map = new Uint8Array(aw * ah);
  const rowX0 = new Int16Array(ah), rowX1 = new Int16Array(ah);
  const xsAt = new Float32Array(ah * (N + 1));
  const stat = new Uint8Array(aw * ah).fill(1);
  const xs = new Array(N + 1);
  let minX = aw, maxX = 0;
  for (let y = 0; y < ah; y++) {
    const yn = (y + 0.5) / ah;
    for (let k = 0; k <= N; k++) xs[k] = xAtY(bounds[k], yn) * aw;
    xs.sort((p, q) => p - q);
    for (let k = 0; k <= N; k++) xsAt[y * (N + 1) + k] = xs[k];
    if (y < yTop - Math.round(0.05 * ah)) continue;
    const wr = xs[N] - xs[0];
    if (wr < 4) continue;
    // зона дороги для стабилизации (шире зоны обнаружения)
    const m2 = 0.15 * wr + 8;
    const sa = Math.max(0, Math.floor(xs[0] - m2)), sb = Math.min(aw, Math.ceil(xs[N] + m2));
    for (let x = sa; x < sb; x++) stat[y * aw + x] = 0;
    if (y < yTop) continue;
    const m = cfg.margin * wr;
    const xl = Math.max(1, Math.floor(xs[0] - m)), xr = Math.min(aw - 1, Math.ceil(xs[N] + m));
    let lane = 1;
    for (let x = xl; x < xr; x++) {
      const xc = x + 0.5;
      while (lane < N && xc >= xs[lane]) lane++;
      map[y * aw + x] = lane;
    }
    rowX0[y] = xl; rowX1[y] = xr;
    if (xl < minX) minX = xl;
    if (xr > maxX) maxX = xr;
  }
  const yMid = Math.min(ah - 1, Math.round((yTop + ah) / 2));
  const pivot = { x: 0.5 * (xsAt[yMid * (N + 1)] + xsAt[yMid * (N + 1) + N]), y: yMid };
  return { aw, ah, N, y0: yTop, map, rowX0, rowX1, xsAt, stat, pivot, minX, maxX };
}

function laneWidthAt(geo, y, lane) {
  const yy = clamp(Math.round(y), 0, geo.ah - 1), N1 = geo.N + 1;
  return geo.xsAt[yy * N1 + lane] - geo.xsAt[yy * N1 + lane - 1];
}


/* ---------- Стабилизация: сдвиг (tx, ty) и малый поворот θ относительно калибровочного кадра ---------- */
function down2(src, sw, sh, dst) {
  const dw = sw >> 1, dh = sh >> 1;
  for (let y = 0; y < dh; y++) {
    let i = 2 * y * sw, j = y * dw;
    for (let x = 0; x < dw; x++, i += 2, j++) dst[j] = (src[i] + src[i + 1] + src[i + sw] + src[i + sw + 1]) * 0.25;
  }
}

class Stabilizer {
  constructor(cfg) { this.cfg = cfg || CONFIG.stab; this.ok = false; this.nb = 0; this.blocks = []; this.nSkip = 0; this._skip = null; }

  init(gray, w, h, staticMask, pivot) {
    const cfg = this.cfg;
    this.w = w; this.h = h; this.pivot = pivot; this.ok = false; this.nSkip = 0; this._skip = null;
    const l0 = Float32Array.from(gray);
    const w1 = w >> 1, h1 = h >> 1, w2 = w1 >> 1, h2 = h1 >> 1;
    const l1 = new Float32Array(w1 * h1), l2 = new Float32Array(w2 * h2);
    down2(l0, w, h, l1); down2(l1, w1, h1, l2);
    this.cal = [{ w, h, d: l0 }, { w: w1, h: h1, d: l1 }, { w: w2, h: h2, d: l2 }];
    this.cur1 = new Float32Array(w1 * h1); this.cur2 = new Float32Array(w2 * h2);
    const B = cfg.block, cells = [];
    const cw = Math.floor(w / B), ch = Math.floor(h / B), offX = (w - cw * B) >> 1, offY = (h - ch * B) >> 1;
    for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++) {
      const x0 = offX + cx * B, y0 = offY + cy * B;
      let ok = true;
      for (let y = y0; y < y0 + B && ok; y += 4) for (let x = x0; x < x0 + B; x += 4) if (!staticMask[y * w + x]) { ok = false; break; }
      if (!ok) continue;
      let e = 0, nn = 0;
      for (let y = Math.max(y0, 1); y < Math.min(y0 + B, h - 1); y += 2) for (let x = Math.max(x0, 1); x < Math.min(x0 + B, w - 1); x += 2) {
        const gx = (l0[y * w + x + 1] - l0[y * w + x - 1]) * 0.5, gy = (l0[(y + 1) * w + x] - l0[(y - 1) * w + x]) * 0.5;
        e += gx * gx + gy * gy; nn++;
      }
      e /= Math.max(nn, 1);
      if (e >= cfg.minTexture) cells.push({ x0, y0, e });
    }
    cells.sort((p, q) => q.e - p.e);
    const picked = [], taken = new Uint8Array(cells.length);
    for (const sep of [2.2, 1.6, 1.0]) {
      for (let i = 0; i < cells.length && picked.length < cfg.maxBlocks; i++) {
        if (taken[i]) continue;
        const c = cells[i];
        let far = true;
        for (const p of picked) if (Math.hypot(p.x0 - c.x0, p.y0 - c.y0) < sep * B - 1e-6) { far = false; break; }
        if (far) { taken[i] = 1; picked.push(c); }
      }
    }
    this.blocks = picked; this.nb = picked.length;
    this.levels = [0, 1, 2].map(l => this._level(l, picked));
    const nb = Math.max(1, this.nb);
    this._gb = new Float64Array(nb * 3); this._eb = new Float64Array(nb);
    this._wb = new Float64Array(nb); this._nv = new Uint8Array(nb); this._tmp = new Float64Array(nb);
    this.ok = this.nb >= cfg.minBlocks;
    return this.ok;
  }

  // boxes — рамки машин в калибровочных координатах {x0,y0,x1,y1}: блоки, задетые рамкой, не участвуют в оценке (если останется меньше minBlocks — исключения игнорируются)
  setExclusions(boxes) {
    const B = this.cfg.block, n = this.nb;
    if (!this._skip || this._skip.length !== n) this._skip = new Uint8Array(n);
    let k = 0;
    for (let i = 0; i < n; i++) {
      const c = this.blocks[i]; let hit = 0;
      for (const r of boxes) if (c.x0 < r.x1 && c.x0 + B > r.x0 && c.y0 < r.y1 && c.y0 + B > r.y0) { hit = 1; break; }
      this._skip[i] = hit; k += hit;
    }
    if (n - k < this.cfg.minBlocks) { this._skip.fill(0); k = 0; }
    this.nSkip = k;
  }

  _level(l, picked) {
    const B = this.cfg.block, s = 1 << l, img = this.cal[l], W = img.w, Hh = img.h, d = img.d;
    const st = l === 0 ? 2 : 1, px = this.pivot.x / s, py = this.pivot.y / s;
    const X = [], Y = [], T = [], GX = [], GY = [], GJ = [], bs = [], be = [];
    for (const c of picked) {
      bs.push(X.length);
      const xa = Math.max(1, Math.ceil(c.x0 / s)), xb = Math.min(W - 2, Math.floor((c.x0 + B) / s) - 1);
      const ya = Math.max(1, Math.ceil(c.y0 / s)), yb = Math.min(Hh - 2, Math.floor((c.y0 + B) / s) - 1);
      for (let y = ya; y <= yb; y += st) for (let x = xa; x <= xb; x += st) {
        const i = y * W + x;
        const gx = (d[i + 1] - d[i - 1]) * 0.5, gy = (d[i + W] - d[i - W]) * 0.5;
        X.push(x); Y.push(y); T.push(d[i]); GX.push(gx); GY.push(gy); GJ.push(gy * (x - px) - gx * (y - py));
      }
      be.push(X.length);
    }
    const nb = picked.length, H = new Float64Array(nb * 6), S = new Float64Array(nb * 3), VT = new Float64Array(nb);
    for (let b = 0; b < nb; b++) {
      let a00 = 0, a01 = 0, a02 = 0, a11 = 0, a12 = 0, a22 = 0, s0 = 0, s1 = 0, s2 = 0, sT = 0, sT2 = 0;
      const n = be[b] - bs[b];
      for (let k = bs[b]; k < be[b]; k++) {
        sT += T[k]; sT2 += T[k] * T[k];
        const gx = GX[k], gy = GY[k], gj = GJ[k];
        a00 += gx * gx; a01 += gx * gy; a02 += gx * gj; a11 += gy * gy; a12 += gy * gj; a22 += gj * gj;
        s0 += gx; s1 += gy; s2 += gj;
      }
      const nn = Math.max(n, 1);
      VT[b] = Math.max(sT2 / nn - (sT / nn) * (sT / nn), 0);
      H.set([a00 - s0 * s0 / nn, a01 - s0 * s1 / nn, a02 - s0 * s2 / nn, a11 - s1 * s1 / nn, a12 - s1 * s2 / nn, a22 - s2 * s2 / nn], b * 6);
      S.set([s0, s1, s2], b * 3);
    }
    const F = a => Float32Array.from(a);
    return { nb, bs: Int32Array.from(bs), be: Int32Array.from(be), X: F(X), Y: F(Y), UX: F(X.map(v => v - px)), UY: F(Y.map(v => v - py)), T: F(T), GX: F(GX), GY: F(GY), GJ: F(GJ), H, S, VT, w: W, h: Hh };
  }

  // Один уровень Гаусса–Ньютона (обратно-композиционный LK, сдвиг + поворот, смещение яркости по блоку, робастные веса блоков)
  _lk(lv, cur, p, iters) {
    const cfg = this.cfg, nb = lv.nb, W = cur.w, Hh = cur.h, d = cur.d;
    const gb = this._gb, eb = this._eb, wb = this._wb, nv = this._nv, sk = this.nSkip ? this._skip : null;
    let inl = 0, rho = 99, fail = false, conv = false, lastStep = 99;
    const floor2 = cfg.errFloor * cfg.errFloor;
    for (let it = 0; it < iters; it++) {
      const tx = p[0], ty = p[1], th = p[2];
      let nvalid = 0;
      for (let b = 0; b < nb; b++) {
        let g0 = 0, g1 = 0, g2 = 0, se = 0, se2 = 0, cnt = 0;
        if (sk && sk[b]) { nv[b] = 0; eb[b] = 1e9; continue; }
        const k1 = lv.be[b];
        for (let k = lv.bs[b]; k < k1; k++) {
          const qx = lv.X[k] + tx - th * lv.UY[k], qy = lv.Y[k] + ty + th * lv.UX[k];
          if (qx < 0 || qy < 0 || qx >= W - 1 || qy >= Hh - 1) continue;
          const x0 = qx | 0, y0 = qy | 0, fx = qx - x0, fy = qy - y0, i0 = y0 * W + x0;
          const a = d[i0] + (d[i0 + 1] - d[i0]) * fx, c = d[i0 + W] + (d[i0 + W + 1] - d[i0 + W]) * fx;
          const e = a + (c - a) * fy - lv.T[k];
          g0 += lv.GX[k] * e; g1 += lv.GY[k] * e; g2 += lv.GJ[k] * e; se += e; se2 += e * e; cnt++;
        }
        if (cnt < 0.8 * (k1 - lv.bs[b])) { nv[b] = 0; eb[b] = 1e9; continue; }
        const me = se / cnt;
        gb[b * 3] = g0 - me * lv.S[b * 3]; gb[b * 3 + 1] = g1 - me * lv.S[b * 3 + 1]; gb[b * 3 + 2] = g2 - me * lv.S[b * 3 + 2];
        eb[b] = Math.sqrt(Math.max(se2 / cnt - me * me, 0)); nv[b] = 1; nvalid++;
      }
      if (nvalid < 2) { fail = true; break; }
      let h00 = 0, h01 = 0, h02 = 0, h11 = 0, h12 = 0, h22 = 0, g0 = 0, g1 = 0, g2 = 0, rs = 0;
      inl = 0;
      const reweight = it < cfg.reweightIters;   // веса блоков пересчитываем только в первых итерациях, дальше фиксируем — так LK надёжно сходится
      for (let b = 0; b < nb; b++) {
        let w = 0;
        if (nv[b]) {
          if (reweight) {
            const thr = Math.max(cfg.errFloor, Math.sqrt(cfg.rhoMax * lv.VT[b]));
            w = eb[b] <= thr ? 1 : (eb[b] >= 2 * thr ? 0 : 2 - eb[b] / thr);
          } else w = wb[b];
        }
        wb[b] = w;
        if (w <= 0) continue;
        h00 += w * lv.H[b * 6]; h01 += w * lv.H[b * 6 + 1]; h02 += w * lv.H[b * 6 + 2];
        h11 += w * lv.H[b * 6 + 3]; h12 += w * lv.H[b * 6 + 4]; h22 += w * lv.H[b * 6 + 5];
        g0 += w * gb[b * 3]; g1 += w * gb[b * 3 + 1]; g2 += w * gb[b * 3 + 2];
        if (w >= 0.5) { inl++; rs += eb[b] * eb[b] / Math.max(lv.VT[b], floor2); }
      }
      rho = inl ? rs / inl : 99;
      const ridge = cfg.rollPrior * 0.5 * (h00 + h11) * Math.pow(0.1 * lv.w, 2) + 1e-9;
      const dp = solve3([[h00, h01, h02], [h01, h11, h12], [h02, h12, h22 + ridge]], [g0, g1, g2]);
      if (!dp) { fail = true; break; }
      p[0] -= dp[0]; p[1] -= dp[1]; p[2] = clamp(p[2] - dp[2], -cfg.maxRoll, cfg.maxRoll);
      const stepPx = Math.max(Math.abs(dp[0]), Math.abs(dp[1]), Math.abs(dp[2]) * 0.3 * lv.w);
      lastStep = stepPx;
      if (stepPx < cfg.convTol) { conv = true; if (stepPx < 0.003) break; }
      else conv = false;
    }
    return { p, inl, rho, conv, fail, step: lastStep };
  }

  // Пирамида L2 → L1 → L0. Если на полном разрешении кадр смазан (оценка не проходит), принимаем результат уровня L1
  _refine(cur0, cur1, cur2, p0) {
    const cfg = this.cfg, need = Math.max(cfg.minBlocks, Math.ceil(cfg.minInlierFrac * (this.nb - this.nSkip))), ex = this.sway > cfg.swayPx ? cfg.swayIter : 0;   // при качании — больше итераций LK
    const bad = { ok: false, p: p0.slice(), inl: 0, rho: 99 };
    let p = [p0[0] / 4, p0[1] / 4, p0[2]];
    const r2 = this._lk(this.levels[2], cur2, p, cfg.iterL2 + ex);
    if (r2.fail) return bad;
    p = [r2.p[0] * 2, r2.p[1] * 2, r2.p[2]];
    const r1 = this._lk(this.levels[1], cur1, p, cfg.iterL1 + ex);
    if (r1.fail) return bad;
    const pL1 = [r1.p[0] * 2, r1.p[1] * 2, r1.p[2]];
    const ok1 = r1.inl >= need && r1.rho <= cfg.rhoOk && r1.step < 2 * cfg.convTol;
    const r0 = this._lk(this.levels[0], cur0, pL1.slice(), cfg.iterL0 + ex);
    if (!r0.fail) {
      const ok0 = r0.inl >= need && r0.rho <= cfg.rhoOk && r0.step < 2 * cfg.convTol;
      if (ok0 || !ok1) return { ok: ok0, p: r0.p, inl: r0.inl, rho: r0.rho, step: r0.step };
    }
    return ok1 ? { ok: true, p: pL1, inl: r1.inl, rho: r1.rho, step: r1.step * 2, coarse: true } : bad;
  }

/* ---------- Прямое и обратное преобразование «калибровочные координаты ↔ текущий кадр» ---------- */
function warpFwd(p, pivot, x, y) {   // калибровочные → текущий кадр (координаты анализа)

}

/* ---------- Уточнение кромки по профилю яркости кадра исходного разрешения (чистая функция) ---------- */

/* =====================  Лимит по GPS + OpenStreetMap  ===================== */
function distToWay(lat, lon, geom) {
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;

    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    const t = L2 > 0 ? clamp(-(ax * dx + ay * dy) / L2, 0, 1) : 0;
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}
async function detectLimitGps(progress) {
  if (!navigator.geolocation) throw new Error('Геопозиция недоступна в этом браузере. Введи лимит вручную.');
  progress('Определяю местоположение (до 10 с)…');
  let pos;
  try {
    pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }));
  } catch (e) {
    const c = e && e.code;
    throw new Error(c === 1 ? 'Доступ к геопозиции запрещён. Разреши его для сайта в настройках браузера или введи лимит вручную.' : (c === 3 ? 'Геопозиция не определилась за 10 с. Выйди на открытое место или введи лимит вручную.' : 'Не удалось определить местоположение. Введи лимит вручную.'));
  }
  progress('Ищу дорогу в OpenStreetMap (до 8 с)…');
  const lat = pos.coords.latitude, lon = pos.coords.longitude;
  const q = '[out:json][timeout:8];way(around:25,' + lat.toFixed(6) + ',' + lon.toFixed(6) + ')["highway"];out tags geom;';
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 8000);
  let data;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }, signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    return { kmh: 0, text: 'Не найден: ' + (e && e.name === 'AbortError' ? 'сервер OpenStreetMap не ответил за 8 с' : 'ошибка запроса') + '. Введи лимит вручную.' };
  } finally { clearTimeout(tm); }
  const ways = (data && data.elements || []).filter(w => w.type === 'way' && w.geometry && w.tags);
  if (!ways.length) return { kmh: 0, text: 'Не найден: рядом нет дорог в OpenStreetMap. Введи лимит вручную.' };
  let best = null, bd = Infinity;
  for (const w of ways) { const d = distToWay(lat, lon, w.geometry); if (d < bd) { bd = d; best = w; } }
  const tg = best.tags, name = tg.name || tg.ref || 'без названия';
  const m = /^\s*(\d{1,3})\s*(km\/h)?\s*$/i.exec(tg.maxspeed || '');
  if (!m) return { kmh: 0, text: 'Не найден: для дороги «' + name + '» в OpenStreetMap нет числового ограничения. Введи лимит вручную.' };
  const kmh = parseInt(m[1], 10);
  const text = 'Улица: ' + name + ' — ' + kmh + ' км/ч. Источник: OpenStreetMap. Данные OSM бывают неточными — сверяйся со знаком.';
  S.limitSrc = text;

}

function drawTag(g, o, placed) {

  g.font = '800 ' + big + 'px ' + TAG_FONT;

  g.font = '650 ' + sm + 'px ' + TAG_FONT;

  const w = Math.round(pad * 2 + wNum + (wTxt ? pad * 0.8 + wTxt : 0)), h = Math.round(big * 1.34);

ЕДИНИЦЫ | Время t, t0, t1, tEnd, tShow, tEarly, tSplit… — секунды ВИДЕО-времени (метка кадра), не стенные часы. Поля trel, tEarlyRel, tRel — секунды от начала трека (или от начала разбираемой попытки). Скорости — км/ч; пути, невязки, sg, rms — метры; x, y, w, h, area — пиксели кадра анализа (размер aw×ah в #setup, при калибровке — масштаб px→м своё в каждой полосе); доли и оценки гипотез — 0…1; флаги — 0/1; пусто/null — значение не определено или не применимо.
НАДЁЖНОСТЬ | ИЗМЕРЕНО: счётчики, времена, координаты, невязки, скорости, значения полей CORE. ГИПОТЕЗА: hrCause*, hrScore*, efClass*, efScore*, efExplain, evidence, against, explanation, stageLost/notShownWhy (по состоянию на конец трека), оценка машин vehStrict/vehLinked. Гипотеза назначается только при двух и более независимых признаках; все оценки по каждой причине (sc_*) выгружены — классификацию можно пересчитать иначе, пороги — в meta.xcfg.
ЧТО НЕ СМЕШИВАТЬ | Цепочка детектора (chains) — последовательность рамок детектора машин в одной полосе; трек (tracks) — объект трекера; оценка машин (vehiclesEstimate) — компонента графа «цепочки ↔ треки»; попытка (attempts) — один вызов итоговой оценки по отрезку трека (у трека может быть несколько); ранняя попытка — один вызов Tracker._early. Числа этих сущностей НЕ складываются: число уникальных машин неизвестно.
ЛИМИТЫ | Журналы ограничены (meta.tables: rows/cap/dropped, meta.drops). Всё, что не поместилось, посчитано (dropped, drops.*) — выгрузка не теряет записи молча. События одного типа на один трек ограничены (xcfg.evPerType), их полный счёт — поле evCounts строки трека.
НЕ ИМИТИРУЕТСЯ | Если значение нельзя получить без изменения алгоритма, поле пустое (null), а не подставленное. Список таких полей и ограничений — meta.limitations и summaryText.
#tracks
id | Номер трека (сквозной в прогоне). Один объект трекера; одна машина может дать несколько треков (фрагментация, смена ID), один трек — склеить несколько машин.
res | Итог трека: PASS — есть скорость (итоговая T1 или предварительная T2, см. finalTier); ALIVE — трек ещё жив на момент выгрузки; иначе код отказа CORE (tr.rej: REJECT_*), либо ENDED (число показывалось, итога нет), либо NEVER_SHOWN.
cause | Нормализованная причина: PASS, ALIVE, DUPLICATE (убит как дубль), GAP_RESET (сброс по паузе), FLUSH_VIDEO_END / FLUSH_STAB_LOST / FLUSH_BG_RESET / FLUSH_OTHER (принудительное завершение), NO_CONFIRM_FRAMES (не набрал кадров подтверждения), NO_MOVE (не двигался), либо код отказа CORE без REJECT_ с подпричиной (HIGH_RMS:FAR_SCALE, TOO_FEW_POINTS, NO_CONFIRM и т.д.).
endBy | Как закончился трек (tr.why CORE): miss — потерян и истёк limbo; occluded — потерян за преградой; gap — сброс по паузе; flush — принудительное завершение; dup — убит как дубль; пусто — иное.
endWhy | Причина завершения, переданная в событие end (аргумент why колбэка трекера).
rej | Код отказа CORE (tr.rej): REJECT_DUPLICATE, REJECT_TOO_FEW_POINTS, REJECT_NO_FIT, REJECT_TOO_SLOW, REJECT_HIGH_RMS / REJECT_HIGH_REL_ERR / REJECT_RMS_AND_REL, REJECT_NO_CONFIRM, REJECT_SPEED_SPREAD, REJECT_TOO_SHORT_PATH, REJECT_UNVERIFIED. Пусто, если отказа нет. Может быть непустым и при res=PASS (когда выдан предварительный результат вместо итога).
flags | Описательные флаги состояния трека через | (NOT_CONFIRMED, NOT_MOVED, PTS<finalMin, PTS<showMin, WIN<minShow, PATH<minTravel, REL>showErr, RMS>finalMax, SPEED<min, SPEED>max, SPREAD, ENDED_BY_MISS/OCCLUDED, LANE_SWITCH, XLANE_BLOCKED, FRAG_SUPPRESSED, BLOB_MERGED, STAB_NOT_OK, AREA_JUMP, SPEED_JUMP, NO_DET_AT_LOSS, DET_AT_LOSS). Это наблюдения, а не причины: причину назначает cause/hrCause.
cls | Класс трека по рамкам детектора (сумма score по классам привязанных блобов): car, truck, bus, другие классы детектора; unknown — детектор ни разу не подтвердил блоб трека.
clsScore | Максимальный score детектора среди рамок, подтвердивших блобы трека.
detFrac | Доля блобов трека, подтверждённых рамкой детектора (перекрытие ≥ 0.3).
large | 1 — класс truck или bus.
dv | Номера цепочек детектора (chains.dv), с которыми пересекались блобы трека, через +.
lane0 | Полоса при рождении трека.
lane | Полоса на момент конца трека.
laneSw | Сколько раз трек менял полосу (CORE).
xBlocked | Сколько раз блоб соседней полосы был отвергнут привязкой (XLANE_BLOCKED).
dupOf | id трека-«победителя», если этот трек убит как дубль; иначе пусто.
idSwitch | 1 — CORE зафиксировал при рождении этого трека смену ID (трек продолжает недавно потерянный; связь replaces/replacedBy).
t0 | Время рождения трека, с.
tEnd | Время завершения трека, с.
dur | Длительность жизни (tEnd − t0), с.
visibleSec | От рождения до последнего привязанного блоба, с.
sinceLastBlobSec | От последнего блоба до конца трека (хвост пропуска), с.
frames | Число кадров жизни трека, учтённых CORE (tr.frames).
nBlobs | Число блобов, привязанных к треку.
bornZone | Зона кадра при рождении: FAR (дальняя), MID, NEAR (ближняя) — по доле пройденной калибровочной зоны.
confirmed | 1 — трек двигался и прожил confirmFrames кадров (подтверждён как движущийся объект).
tConfirm | Секунд от рождения до подтверждения.
moved | 1 — CORE признал трек сдвинувшимся (tr.moved).
shown | 1 — по треку когда-либо показывалось число (в любой момент жизни).
shownAtEnd | 1 — число показано на момент конца трека.
drawn | 1 — метка трека рисовалась на экране.
tShow | Секунд от рождения до первого показа числа.
showMode | Способ первого показа: gate — ранняя скорость по воротам, wls — по регрессии.
early | 1 — первое число показано РАННИМ способом (по воротам, mode gate).
kmhEarly | Ранняя скорость, км/ч (пусто, если первое число было не ранним).
kmhShow | Скорость первого показанного числа, км/ч.
kmhLive | Последнее «живое» значение tr.kmh на момент конца, км/ч.
kmhLiveMin | Минимальное живое значение за жизнь, км/ч.
kmhLiveMax | Максимальное живое значение за жизнь, км/ч.
kmhA_st | Скорость A по взвешенной регрессии (WLS) по всем точкам трека на момент конца, км/ч.
kmhB_gate | Скорость B по воротам (пересечения калибровочных линий) на момент конца, км/ч.
gatesN | Сколько ворот использовано в B.
dAB | Относительное расхождение A и B: |A−B| / max(A, B, 1).
kmhFinal | Итоговая скорость выданного результата (T1 или T2), км/ч; пусто — результата нет.
finalMode | Режим выданного результата (mode CORE: wls, win, gate, plain/unverified и др.).
finalA | A выданного результата, км/ч.
finalB | B выданного результата, км/ч.
finalConf | Уверенность выданного результата: high / mid / low (по согласию A и B).
kmhBest | Лучшая скорость трека: итог, иначе A, иначе живая, иначе B.
pts | Число точек регрессии в треке на момент конца (без отброшенных онлайн).
path | Путь по точкам, м.
win | Длительность окна точек, с.
fitRms | rms невязки WLS по точкам трека, м (сравнивается с finalMaxRmsM).
fitRel | Относительная погрешность наклона WLS (σ_slope / |slope|) — сравнивается с showErr.
fitChi | Невязка прямой в единицах σ точек (χ): ≈1 — модель согласуется с заявленной точностью, ≫1 — невязка больше заявленной.
fitRelEff | fitRel × max(1, χ): эффективная погрешность с учётом реальной невязки.
fitN | Сколько точек осталось в WLS после её внутреннего отсева выбросов.
rawK | Сырая «живая» скорость последнего расчёта, км/ч.
liveRel | Относительная погрешность последнего живого расчёта.
liveRms | rms последнего живого расчёта, м.
jumps | Счётчик скачков живой скорости (CORE).
missEps | Число эпизодов пропуска (трек без блоба в кадрах).
missFrames | Сумма кадров во всех эпизодах пропуска.
missMaxFrames | Самый длинный эпизод пропуска, кадров.
gapMaxSec | Самый длинный пропуск, с.
gapTotalSec | Суммарное время пропусков, с.
missDetInBox | Кадров пропуска, в которых прогноз положения трека лежал внутри рамки детектора.
nLost | Сколько раз трек терялся (событие lost).
nRev | Сколько раз трек возвращался (revive).
lossZone | Зона кадра при последней потере: FAR / MID / NEAR.
lossDetNear | Рамка детектора у места потери: IN_BOX (прогноз внутри рамки), NEAR (в 40 px), FAR (дальше), NO_BOX (рамок нет); пусто — потери не было.
lossDetDist | Расстояние от прогноза до ближайшей рамки детектора, px (0 — внутри).
lossDetCls | Класс ближайшей рамки у места потери.
lossDetScore | Score этой рамки.
lossDetAgeSec | Возраст рамки (с момента вызова детектора), с.
lossDetClaimedBy | Номера ДРУГИХ треков (через +), чьи блобы привязаны к этой же ближайшей рамке («рамку занял другой трек»); пусто — никто.
lossVdAtPred | 1 — на прогнозе положения при потере была рамка детектора (CORE tr.loss.vd).
shiftMaxPx | Максимальный сдвиг позы стабилизации от калибровочной за жизнь трека, px.
swayMax | Максимальное качание (sway) за жизнь, px.
swayAvg | Среднее качание за жизнь, px.
stabBadFrames | Кадров жизни трека, когда стабилизация была не в состоянии ok.
coastFrames | Кадров жизни трека, пропущенных стабилизацией (coast), без обработки трекером.
flushWhy | Для endBy=flush: причина принудительного завершения (VIDEO_END, STAB_LOST, BG_RESET, OTHER).
wPctMax | Максимальная ширина блоба в долях ширины полосы.
overlapPctMax | Максимальная доля ширины блоба, заходящая в соседнюю полосу, %.
fillMin | Минимальная заполненность рамки блоба (площадь / площадь рамки).
ownerFracMin | Минимальная доля «хозяина кромки» среди склеенных блобов (ownR); < 1 — часть кластера отброшена.
areaMax | Максимальная площадь блоба, px².
wPxMax | Максимальная ширина блоба, px.
hPxMax | Максимальная высота блоба, px.
areaJumps | Счётчик скачков площади блоба (CORE).
fragSuppressed | Сколько блобов-осколков подавлено (frag_suppressed).
blobMerges | Максимальная кратность склейки блобов (b.mg).
laneSwitchLog | Журнал смен полосы: время:из>в через |.
rejSub | Подпричина отказа CORE: для HIGH_RMS — FAR_SCALE/OUTLIER/JUMP/SYSTEMATIC/NOISE (классификатор CORE), для UNVERIFIED — REL_EFF/SPREAD/NO_HALVES, DET_BOX — убит рамкой детектора.
hrChi | χ из классификатора CORE (tr.hr.chi) для последнего отказа HIGH_RMS.
hrRmsTrim | rms после отбрасывания 1–3 худших точек (tr.hr.rmsT), м.
hrJump | Доля Σr², остающаяся после лучшего разреза на две части (tr.hr.bj): малое значение — скачок уровня невязки.
hrAc1 | Автокорреляция соседних невязок (tr.hr.ac): большое — гладкая/систематическая невязка.
kmhC | Скорость C — устойчивая оценка Тейла–Сена по всем точкам, км/ч.
arbSrc | Источник арбитра A/B/C, если он применялся.
dAC | Расхождение A и C.
dBC | Расхождение B и C.
dEA | Расхождение ранней скорости и A.
dEF | Расхождение ранней скорости и итоговой.
cSpread | Разброс оценок C по частям трека (мера разгона/скачка).
resets | Сколько раз CORE сбрасывал накопленные точки трека (из-за скачков скорости).
cSaves | Сколько скачков CORE «простил», потому что C подтверждала прежнюю скорость.
recovers | Сколько раз сработало восстановление трека (recover).
boxDup | 1 — убит как осколок под одной рамкой детектора (DET_BOX).
finalStatus | Статус результата: FINAL, FINAL_ROB, SHORT (итоговые T1); ARB, PROV, UNVERIFIED, SHORT_GATE (предварительные T2).
finalTier | 1 — итоговый результат (T1), 2 — предварительный (T2); пусто — результата нет.
finalNOut | Сколько точек исключено при расчёте результата.
finalC | C результата, км/ч.
fAB | Расхождение A и B в результате.
fAC | Расхождение A и C в результате.
fBC | Расхождение B и C в результате.
arbA | A арбитра, км/ч.
arbB | B арбитра, км/ч.
arbC | C арбитра, км/ч.
showA | A на момент первого показа, км/ч.
showB | B на момент первого показа, км/ч.
showC | C на момент первого показа, км/ч.
showN | Число точек на момент первого показа.
showConf | Уверенность при первом показе.
bestK | Скорость лучшей валидной оценки живого окна (tr.best), км/ч.
bestRe | Её относительная погрешность.
bestN | Её число точек.
bestPath | Её путь, м.
lvpK | Скорость последней валидной оценки живого окна, км/ч.
failWhy | Причины отказов на стадиях итога: rob:… arb:… prov:… val:… short:…; пусто при успехе.
robWhy | Почему не удался итог по очищенным точкам (_robFinal).
arbWhy | Почему не удался арбитр A/B/C (_rescue).
provWhy | Почему не удался предварительный результат (_provFinal).
valWhy | Причина провала валидации обычной регрессии (REL_EFF, SPREAD, NO_HALVES).
shortWhy | Почему не удался короткий итог (_finishEarly).
robMode | Режим итога по очищенным точкам (win — лучшее окно, иное — робастная прямая).
robN | Точек в очищенном итоге.
robNI | Точек, признанных «своими» (inliers).
robNOut | Точек, исключённых как выбросы.
robMaxRun | Самая длинная серия подряд исключённых точек.
robKA | Скорость очищенного итога, км/ч.
robRms | rms очищенного итога, м.
robChi | χ очищенного итога.
robRelEff | Эффективная погрешность очищенного итога.
robPath | Путь очищенного итога, м.
robSpread | Расхождение скоростей половин очищенного итога.
robKa | Скорость первой половины очищенного итога, км/ч.
robKb | Скорость второй половины очищенного итога, км/ч.
valRelEff | Эффективная погрешность при валидации обычной регрессии.
valChi | χ при валидации.
valSpread | Расхождение половин при валидации.
halfKa | Скорость первой половины точек трека, км/ч.
halfKb | Скорость второй половины точек трека, км/ч.
halfSpread | Расхождение скоростей половин.
nBadPts | Сколько точек отброшено онлайн (tr.bad): сильно мимо прогноза при плохом контексте или мимо вдвое сильнее допуска.
nHold | Счётчик привязок по перекрытию без точки (ветка hold; в v4 выключена, обычно 0).
segN | Число завершённых отрезков трека (после сбросов).
segLog | Журнал отрезков: число точек~интервал времени~результат~причина через |.
recInfo | Параметры последнего восстановления трека: dt (пауза), ds, dx, ov, miss, area, mg.
gateRejAll | За все эпизоды пропуска: почему блоб не привязался к треку (причина=число через |).
gateRejLast | То же для последнего эпизода.
ctxMerged | Доля точек трека, у которых блоб был склейкой нескольких блобов.
ctxOwnerDrop | Доля точек с отброшенными осколками соседней полосы (хозяин кромки).
ctxAreaJump | Доля точек сразу после скачка площади.
ctxXJump | Доля точек сразу после скачка по x.
ctxAfterMiss | Доля точек — первых после пропуска.
ctxSoft | Доля точек с мягкой кромкой (soft).
ctxRefined | Доля точек, уточнённых по кадру исходного разрешения.
ctxDet | Доля точек, подтверждённых рамкой детектора.
ssrCtxShare | Доля суммы квадратов невязок (относительно C), приходящаяся на точки с плохим контекстом (склейка, хозяин, скачки, после пропуска, смена полосы).
zMedC | Медиана |z| невязок относительно C.
fx | Штатная строка «следствие» приложения (fxRow); в JSON — вложенный объект, в CSV — отдельные колонки fx_*, описание в разделе #fx.
stageReached | Какой стадии воронки трек достиг: BORN, CONFIRMED, SHOWN, EARLY (число по воротам), PROV (предварительный итог T2), FINAL (итог T1).
stageLost | Где трек потерян для итога: CONFIRM, SHOW, FINAL; OPEN — трек ещё жив; пусто — получил итог T1.
notShownWhy | Почему не показано число (только подтверждённые треки без числа; по состоянию на конец трека): NO_POINTS[:причина], FEW_PTS<3, NOT_MOVED, LIVE_NEVER_COMPUTED(...), LIVE_UNRELIABLE(...), PATH<minShow, WIN<minShow, UNSTABLE, PTS<showMin, SLOW, UNKNOWN. Первая из перечисленных в notShownAll. Это гипотеза по состоянию трека, а не запись момента.
notShownAll | Все условия, не выполненные на конец трека, через +.
earlyTry | Сколько раз вызывался Tracker._early без успеха (ранняя скорость по воротам не появилась).
earlyWhyTop | Самая частая причина, по которой _early не сработал: OFF, FEW_PTS, NOT_MOVED, NOT_CAR, NO_GATES, KB_RANGE, PATH, FIT_DISAGREE, C_DISAGREE, CONDITIONS_MET_NOT_SHOWN. Зеркало условий _early.
earlyWhyLast | Причина при последнем вызове _early.
earlyWhyAll | Все причины ранних отказов: причина=число через |.
nObs | Число наблюдений трека (блобов, привязанных к треку, включая те, что не дали точки).
obsDropped | Наблюдений не записано из-за лимита журнала наблюдений трека.

sc_VEHICLE_LOST | Оценка гипотезы VEHICLE_LOST.
sc_FILTER_REJECT | Оценка гипотезы FILTER_REJECT.
#events
seq | Сквозной номер события. Растёт при каждом событии, в том числе не попавшем в журнал из-за лимитов, поэтому пропуски в нумерации видны (сколько потеряно — meta.drops.eventsByType).
t | Время события, с видео-времени (метка кадра).
ev | Тип события (описание типов — раздел eventTypes).
id | Номер трека. Пусто у событий без трека: stab_state, cluster_owner, blob_merge_gap, blob_merge_det, redetect.
lane | Полоса трека на момент события (у redetect — полоса цепочки; у блоб-событий без трека — полоса блоба в details/полях события).
cls | Класс трека по голосам рамок детектора на момент события (car, truck, bus, unknown…). У redetect — класс новой рамки.
dv | Номер цепочки детектора, к которой трек был привязан в последний раз (пусто — трек ни разу не попадал в рамку). У redetect — номер новой цепочки.
x | Координата x центра блоба трека на момент события, px кадра анализа.
y | Координата y трека (кромка блоба, по которой считается путь), px кадра анализа.
zone | Зона трека по глубине калибровки: FAR / MID / NEAR (дальняя треть, средняя, ближняя).
relSeq | Номер (seq) связанного события: для miss_end, lost, miss_open_at_end — miss_start; для revive — lost; для id_switch — end заменённого трека; для recover — miss_start. Пусто, если связанное событие не записано.
details | Остальные поля события в формате «ключ=значение» через «|»; вложенные поля — через точку (nd.d=12.3). В JSON эти поля лежат прямо в объекте события. Названия полей — раздел eventDetails.
#eventTypes
stab_state | Смена состояния стабилизатора кадра (ok, init, coast, lost, off). Без трека. Показывает, когда измерения шли без стабилизации.
birth | Рождение трека: первый блоб, не привязанный ни к одному треку. Записывает место рождения (зона, рамка детектора под блобом).
confirm | Трек подтверждён: двигался и набрал confirmFrames кадров (условие «подтверждён» воронки).
show | Трек показал число скорости. mode=gate — ранняя скорость по воротам (Tracker._early), mode=wls — скорость по регрессии. Фиксирует момент и качество первого показа.
miss_start | Начало пропуска: у трека в кадре нет привязанного блоба. Записывает прогноз положения и ближайшую рамку детектора (nd).
miss_end | Конец пропуска: блоб снова привязан. via говорит, как именно (normal / recover / hold), gateRej — почему блоб не привязывался во время пропуска.
miss_open_at_end | Пропуск не закончился до конца жизни трека (трек убит или завершён во время пропуска). Поля как у miss_end, via=open.
lost | Трек, у которого число уже было показано, слишком долго не получал блоб (why=miss или occluded) и переведён CORE в список «потерянных» на reviveSec: найдётся подходящий блоб — трек возродится (revive), нет — завершится (limboExp). Записывает, была ли под прогнозом рамка детектора (vdAtPred), и ближайшую рамку (nd).
revive | Потерянный трек возобновлён с тем же ID: появился блоб, согласующийся с метрическим прогнозом траектории (по s и по x), не позже reviveSec после потери.
recover | Живой трек с пропуском в 1 и более кадров получил блоб той же полосы, согласующийся с метрическим прогнозом (по s) либо накрывающий прогноз (info.ov=1): CORE принял его как продолжение. Принятому только по перекрытию кромке не верят, и точка в регрессию не идёт.
id_switch | CORE зафиксировал смену ID: новый трек родился там, где ожидалась недавно потерянная и не возрождённая машина (не дальше 4 м по s от экстраполяции её траектории и не дальше 2,5 ширин по x, не позже 1,5 с после окончания лимба). replaces — какой закончившийся трек заменён (подбор по тому же критерию, зеркало CORE).
dup_kill | Дубль убит: трек признан дублем другого (общий блоб или осколки под одной рамкой детектора, via=det_box). keptId — какой трек оставлен.
xlane_blocked | Блоб соседней полосы не привязан к треку: он лежит вне полосы трека (перекрытие с полосой трека меньше доли xlaneMinOv его ширины) и не прошёл исключение «объединение с осколками» (XLANE_BLOCKED). Журнал хранит только первые 3 такие записи на трек; полное число — поле nXb в строке трека.
frag_suppressed | Непривязанный блоб не стал новым треком (FRAG_SUPPRESSED): он перекрывается по x с блобом трека той же полосы, получившего блоб в этом же кадре, и либо выше его кромки, либо меньше 0,6 его площади — считается осколком той же машины.
lane_switch | Трек сменил полосу (from → to); restarted=1 — набор точек начат заново.
end | Трек закончен: итог (res/cause), чем закончен (endBy), до какой стадии дошёл (stage) и где потерян (stageLost), причина HIGH_RMS и класс «ранняя → итог», если есть.
cluster_owner | Кластер: блобы соседних полос, соприкасающиеся через границу полосы (машина на границе). Оставлен «владелец» — блоб с самой нижней кромкой (ближе к камере; при равенстве в пределах ownerTol — самый крупный) среди блобов с площадью не меньше max(minAreaPx, ownerFrac × максимум); остальные блобы кластера отброшены, их площадь запомнена в owner-площади (exA). Без трека.
blob_merge_gap | Два блоба склеены по зазору ≤ mergeGapPx (BLOB_MERGED, склейка по расстоянию). Без трека.
blob_merge_det | Два блоба склеены потому, что их накрывает одна рамка детектора (BLOB_MERGED по детектору). Без трека.
area_jump | Скачок площади блоба трека между соседними кадрами (AREA_JUMP; q = площадь/предыдущая).
x_jump | Скачок координаты x блоба трека (X_JUMP).
size_jump | Скачок ширины/высоты блоба относительно предыдущего наблюдения больше порога xcfg.sizeJump.
time_gap | Интервал между соседними наблюдениями трека больше xcfg.gapSec (в наблюдениях трека, не в кадрах видео).
blob_merged_start | У блоба трека появился признак склейки (mg > 0), которого не было в предыдущем наблюдении.
blob_merged_end | Признак склейки блоба трека исчез.
owner_drop_start | Начало состояния «часть блоба отброшена как чужая» (exA > 0): владелец кластера отбросил часть площади.
det_box_lost | Рамка детектора, покрывавшая блоб трека в прошлом наблюдении, больше блоб не покрывает (рамка пропала, сместилась или детектор не вызывался).
dv_change | Соседние наблюдения трека лежат в разных цепочках детектора: признак склейки двух машин или смены ID (гипотеза).
cls_change | Соседние наблюдения трека покрыты рамками разных классов детектора (car ↔ truck и т.д.).
finish_attempt | Одна попытка итоговой оценки (вызов Tracker._finishCore по сегменту точек). У одного трека бывает несколько. Подробности — таблица attempts.
redetect | Новая цепочка детектора похожа на продолжение оборвавшейся 1,2–4 с назад (согласие по s и скорости). Цепочки НЕ объединяются: это только связь для оценки числа машин.

show.mode | gate — ранняя скорость по воротам; wls — по регрессии.

show.kmhA | Скорость по взвешенной регрессии (метод A, stabK), км/ч.

miss_start.gapSec | Время с последнего привязанного блоба до начала пропуска, с.

miss_open_at_end.nd0.nBox | Число рамок на начало пропуска.
miss_open_at_end.nd0.cls | Класс ближайшей рамки.

owner_drop_start.ownR | Доля площади владельца в кластере.

det_box_lost.detAge | Возраст рамок детектора на этот кадр, с.
det_box_lost.nBox | Число рамок детектора в последнем вызове.
det_box_lost.cls0 | Класс прежней рамки, покрывавшей блоб.

finish_attempt.ok | 1 — попытка дала результат (T1 или T2).
finish_attempt.status | Метод результата: FINAL, FINAL_ROB, SHORT, ARB, PROV, UNVERIFIED, SHORT_GATE.
finish_attempt.tier | 1 — проверенный итог, 2 — предварительный, 0 — отказ.
finish_attempt.kmh | Скорость попытки, км/ч.
finish_attempt.rej | Код отказа CORE (REJECT_…), если отказ.

finish_attempt.fitRms | RMS регрессии попытки, м.
finish_attempt.fitChi | χ попытки (невязка в долях sg).
